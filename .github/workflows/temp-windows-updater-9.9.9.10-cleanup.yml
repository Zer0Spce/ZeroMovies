name: CLEANUP TEMP Windows Updater 9.9.14

on:
  workflow_dispatch:
  push:
    branches:
      - temp/windows-updater-9.9.9.10
    paths:
      - .github/workflows/temp-windows-updater-9.9.9.10-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete temporary release and tag
        run: gh release delete v9.9.14 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
