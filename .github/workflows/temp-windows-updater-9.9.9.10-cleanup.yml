name: CLEANUP TEMP Windows Updater 9.9.9.10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete temporary release and tag
        run: gh release delete v9.9.9.10 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
