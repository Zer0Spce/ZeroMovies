name: Validate ZeroPlay 1.8.2 Platform UI + Torrents

on:
  push:
    branches: [release/v1.8.2]
    paths:
      - scripts/apply-1.8.2-platform-ui-torrents.py
      - .github/workflows/validate-1.8.2-platform-ui-torrents.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded 1.8.2 patch
        run: python scripts/apply-1.8.2-platform-ui-torrents.py
      - name: Source sanity
        run: |
          git diff --check
          node --check windows/ui/app.js
          node --check windows/ui/downloads.js
          node --check windows/ui/layouts.js
          node --check windows/tsp-search.cjs
          grep -q 'BuildConfig.TV?"classic":"google"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Math.min(20,list.size())' app/src/main/java/com/zerostreams/app/TspSearchProvider.java
          grep -q 'Math.min(20,Math.max(1,config.maxResults||20))' windows/tsp-search.cjs
          grep -q "uiLayout:'youtube'" windows/main.cjs
      - name: Compile Android Mobile and TV
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac --no-daemon
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --no-daemon
      - name: Windows unit tests
        working-directory: windows
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit validated UI and torrent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app windows
          git diff --cached --quiet && exit 0
          git commit -m "Polish 1.8.2 platform defaults and torrent UI"
          git push origin HEAD:release/v1.8.2
