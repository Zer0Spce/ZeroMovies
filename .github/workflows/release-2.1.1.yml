name: ZeroPlay 2.1.1 Production Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: zeroplay-2-1-1-production
  cancel-in-progress: false

jobs:
  android:
    if: contains(github.event.head_commit.message, 'Release ZeroPlay v2.1.1')
    name: Android Mobile + TV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest

      - name: Build signed production APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          mobile=app/build/outputs/apk/mobile/release/app-mobile-release.apk
          tv=app/build/outputs/apk/tv/release/app-tv-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$mobile"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$tv"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$mobile" | head -n 1 | grep -q "versionName='2.1.1'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$tv" | head -n 1 | grep -q "versionName='2.1.1'"
          mkdir -p release-assets
          cp "$mobile" release-assets/ZeroPlay-2.1.1-Android.apk
          cp "$tv" release-assets/ZeroPlay-2.1.1-Android-TV.apk

      - name: Lint Mobile + TV
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease

      - name: Audit Android release files
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.1.1-Android-Production
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  windows:
    if: contains(github.event.head_commit.message, 'Release ZeroPlay v2.1.1')
    name: Windows Portable
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Windows tests
        run: npm test

      - name: Configure bundled keys and existing player vendors
        run: npm run prepare-config

      - name: Download pinned mpv x64 playback engine
        shell: pwsh
        run: |
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261009/mpv-x86_64-20261009-git-36abaa32d0.7z'
          $expected = '9afbe74f4ab885ca512769f8835758eb66b7b8a5ea6d679500588f8e7fec632e'
          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          $actual = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "mpv SHA-256 mismatch: $actual" }
          New-Item -ItemType Directory -Force vendor/mpv | Out-Null
          7z x mpv.7z -ovendor/mpv -y | Out-Host
          $mpv = Get-ChildItem vendor/mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpv) { throw 'mpv.exe missing after extraction.' }
          if ($mpv.Directory.FullName -ne (Resolve-Path vendor/mpv).Path) {
            Copy-Item "$($mpv.Directory.FullName)/*" vendor/mpv -Recurse -Force
          }
          if (!(Test-Path vendor/mpv/mpv.exe)) { throw 'mpv.exe was not normalized to vendor/mpv/mpv.exe.' }
          Remove-Item mpv.7z -Force

      - name: Apply validated Windows 2.1.1 patches
        run: |
          node scripts/apply-offline-mpv-test.cjs
          node scripts/apply-final-windows-polish.cjs
          node scripts/apply-episode-progress-fix.cjs
          node scripts/apply-windows-episode-completion-fix.cjs

      - name: Restore production Windows metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = '2.1.1'
          $pkg.build.win.artifactName = 'ZeroPlay-2.1.1-Windows-x64.${ext}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8

      - name: Build dedicated native mpv video surface
        shell: pwsh
        run: |
          dotnet publish mpv-host-helper/MpvVideoHost.csproj -c Release -r win-x64 --self-contained true -o mpv-host-helper/publish
          Copy-Item mpv-host-helper/publish/MpvVideoHost.exe ./MpvVideoHost.exe -Force
          if (!(Test-Path './MpvVideoHost.exe')) { throw 'MpvVideoHost.exe was not created.' }

      - name: Build standalone ZeroPlayUpdater.exe
        shell: pwsh
        run: |
          dotnet publish updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -o updater-helper/publish
          Copy-Item updater-helper/publish/ZeroPlayUpdater.exe ./ZeroPlayUpdater.exe -Force
          if (!(Test-Path './ZeroPlayUpdater.exe')) { throw 'ZeroPlayUpdater.exe was not created.' }

      - name: Verify Windows release source wiring
        shell: pwsh
        run: |
          $main = Get-Content main.cjs -Raw
          $mpvHostSource = Get-Content mpv-offline.cjs -Raw
          $renderer = Get-Content ui/app.js -Raw
          $core = Get-Content core.cjs -Raw
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.1') { throw "Expected Windows version 2.1.1, got $($pkg.version)" }
          if ($pkg.build.win.artifactName -ne 'ZeroPlay-2.1.1-Windows-x64.${ext}') { throw 'Unexpected production artifact name.' }
          if ($main -notmatch 'MpvOfflinePlayer') { throw 'Main process is not wired to mpv offline playback.' }
          if ($main -notmatch '__zeroEpisodeProbe') { throw 'Direct Windows episode completion probe is missing.' }
          if ($main -notmatch 'playbackCompleted') { throw 'Windows completion lock is missing.' }
          if ($main -notmatch 'completed=position.percent>=95') { throw 'Final provider progress bypass is missing.' }
          if ($main -notmatch 'sourceOverride') { throw 'Per-title playback source override is missing.' }
          if ($mpvHostSource -notmatch 'bundledVideoHost') { throw 'Dedicated native video host is not wired.' }
          if ($mpvHostSource -notmatch '--wid=') { throw 'mpv is not targeting the dedicated native video surface.' }
          if ($mpvHostSource -notmatch "'--osc=no'") { throw 'Default mpv OSC is still enabled.' }
          if ($renderer -notmatch 'episodeReminder') { throw 'Episode watched/in-progress reminders are missing.' }
          if ($renderer -notmatch "if\(!progress\)return ''") { throw 'Started episode fallback marker is missing.' }
          if ($renderer -notmatch "\$\('#detail'\)\.open&&activeDetail") { throw 'Open detail episode refresh is missing.' }
          if ($core -notmatch 'positions\[historyKey\]') { throw 'Per-episode history storage is missing.' }
          if (!(Test-Path './MpvVideoHost.exe')) { throw 'Native video host helper is missing.' }

      - name: Smoke test Windows app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/s','/c','npx electron . --smoke-test' -PassThru -NoNewWindow
          if ($process.WaitForExit(60000)) {
            if ($process.ExitCode -ne 0) { throw "Electron smoke test failed with exit code $($process.ExitCode)." }
            Write-Host 'Electron smoke test completed normally.'
          } else {
            Write-Warning 'Electron smoke test did not exit within 60 seconds; terminating the lingering process tree and continuing packaging.'
            & taskkill.exe /PID $process.Id /T /F | Out-Host
          }

      - name: Build portable Windows ZIP
        run: npx electron-builder --win --x64 --publish never

      - name: Verify portable package, offline player and updater
        shell: pwsh
        run: |
          $zip = 'dist/ZeroPlay-2.1.1-Windows-x64.zip'
          if (!(Test-Path $zip)) { throw 'Windows 2.1.1 portable ZIP was not created.' }
          if (!(Test-Path 'dist/win-unpacked/ZeroPlay.exe')) { throw 'ZeroPlay.exe missing.' }
          if (!(Test-Path 'dist/win-unpacked/ZeroPlayUpdater.exe')) { throw 'ZeroPlayUpdater.exe missing.' }
          if (!(Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'app.asar missing.' }
          if (!(Test-Path 'dist/win-unpacked/resources/mpv/mpv.exe')) { throw 'Bundled mpv.exe is missing.' }
          if (!(Test-Path 'dist/win-unpacked/resources/mpv-host/MpvVideoHost.exe')) { throw 'Dedicated native mpv host is missing.' }
          $verify = 'dist/verify-asar'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          npx --yes @electron/asar extract 'dist/win-unpacked/resources/app.asar' $verify
          $pkg = Get-Content "$verify/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.1.1') { throw "Expected Windows app version 2.1.1, got $($pkg.version)" }
          $updaterSource = Get-Content "$verify/updater.cjs" -Raw
          $mainSource = Get-Content "$verify/main.cjs" -Raw
          $versionSource = Get-Content "$verify/version-manager.cjs" -Raw
          $mpvSource = Get-Content "$verify/mpv-offline.cjs" -Raw
          if ($updaterSource -notmatch 'ZeroPlayUpdater\.exe') { throw 'Packaged updater does not delegate to helper.' }
          if ($updaterSource -match 'tar\.exe|Expand-Archive|robocopy\.exe') { throw 'Legacy updater replacement logic is still packaged.' }
          if ($mainSource -match 'Exit ZeroPlay\?') { throw 'Windows desktop exit confirmation is still packaged.' }
          if ($mainSource -notmatch '__zeroEpisodeProbe') { throw 'Packaged completion probe is missing.' }
          if ($mainSource -notmatch 'completed=position.percent>=95') { throw 'Packaged completion bypass is missing.' }
          if ($mpvSource -notmatch 'bundledVideoHost|--wid=') { throw 'Packaged native mpv embedding is incomplete.' }
          if ($versionSource -notmatch 'detached:true') { throw 'Detached version handoff is missing.' }
          Remove-Item $verify -Recurse -Force
          $extract = 'dist/zip-verify'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          if (!(Test-Path "$extract/ZeroPlay.exe")) { throw 'ZIP does not contain ZeroPlay.exe at root.' }
          if (!(Test-Path "$extract/ZeroPlayUpdater.exe")) { throw 'ZIP does not contain ZeroPlayUpdater.exe at root.' }
          if (!(Test-Path "$extract/resources/app.asar")) { throw 'ZIP does not contain resources/app.asar.' }
          if (!(Test-Path "$extract/resources/mpv/mpv.exe")) { throw 'ZIP does not contain bundled mpv.' }
          if (!(Test-Path "$extract/resources/mpv-host/MpvVideoHost.exe")) { throw 'ZIP does not contain native mpv video host.' }
          Remove-Item $extract -Recurse -Force

      - name: Audit Windows release credentials
        run: python ../scripts/audit-release-secrets.py dist/ZeroPlay-2.1.1-Windows-x64.zip dist/win-unpacked

      - name: Scan packaged Windows build with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable; release blocked.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE); release blocked." }

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.1.1-Windows-Production
          path: windows/dist/ZeroPlay-2.1.1-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: contains(github.event.head_commit.message, 'Release ZeroPlay v2.1.1')
    name: Publish v2.1.1
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.1.1-Android-Production
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.1.1-Windows-Production
          path: release-assets

      - name: Final credential audit
        run: python scripts/audit-release-secrets.py release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ZeroPlay-2.1.1-Android.apk ZeroPlay-2.1.1-Android-TV.apk ZeroPlay-2.1.1-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish ZeroPlay 2.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.1 >/dev/null 2>&1; then
            echo 'v2.1.1 already exists; refusing to overwrite an existing production release.'
            exit 1
          fi
          gh release create v2.1.1 \
            release-assets/ZeroPlay-2.1.1-Android.apk \
            release-assets/ZeroPlay-2.1.1-Android-TV.apk \
            release-assets/ZeroPlay-2.1.1-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay 2.1.1' \
            --notes-file docs/release-2.1.1.md \
            --latest
