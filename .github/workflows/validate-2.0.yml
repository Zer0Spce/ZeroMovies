name: Validate ZeroPlay 2.0 fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Compile mobile and TV debug APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Android lint
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Windows tests
        run: npm test
      - name: Prepare packaged assets
        run: npm run prepare-config
      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check updater.cjs
          node --check ui/app.js
          node --check ui/layouts.js
          node --check ui/live-player.js
          node --check ui/offline-player.js
