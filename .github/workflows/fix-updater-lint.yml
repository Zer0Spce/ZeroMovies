name: Fix Android updater lint
on:
  push:
    branches: ['test/2.0-fixes-1-23']
    paths: ['.github/workflows/fix-updater-lint.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-fixes-1-23
      - name: Fix API 23 compatible content length
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/zerostreams/app/AppUpdater.java')
          s=p.read_text()
          old='long total=c.getContentLengthLong(),done=0;'
          new='long total=c.getContentLength(),done=0;'
          if old not in s:
              raise SystemExit('Expected updater content-length call not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/AppUpdater.java
          git commit -m 'Fix Android updater API 23 content length compatibility'
          git push origin HEAD:test/2.0-fixes-1-23
