name: Release ZeroPlay 2.0.2

on:
  push:
    branches: [release/v2.0.2]

concurrency:
  group: zeroplay-production-v2-0-2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure permanent Android signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeroplay-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeroplay-release.jks" >> "$GITHUB_ENV"
      - name: Test, build and lint signed APKs
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:assembleMobileRelease :app:assembleTvRelease :app:lintMobileRelease :app:lintTvRelease
      - name: Verify and stage Android 2.0.2 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mobile=app/build/outputs/apk/mobile/release/app-mobile-release.apk
          tv=app/build/outputs/apk/tv/release/app-tv-release.apk
          for apk in "$mobile" "$tv"; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='2.0.2'"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionCode='39'"
            ! "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -q application-debuggable
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done
          cp "$mobile" release-assets/ZeroPlay-2.0.2-Android.apk
          cp "$tv" release-assets/ZeroPlay-2.0.2-Android-TV.apk
      - name: Audit Android release assets
        run: python scripts/audit-release-secrets.py release-assets app/src
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0.2-Android
          path: release-assets/*.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeroplay-release.jks"

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Configure bundled keys
        run: npm run prepare-config
      - name: Windows smoke test
        run: npx electron . --smoke-test
      - name: Package Windows 2.0.2 portable ZIP
        run: npm run build
      - name: Verify Windows package and updater source
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ZeroPlay-2.0.2-Windows-x64.zip')) { throw 'Windows 2.0.2 ZIP missing.' }
          if (!(Test-Path 'dist/win-unpacked/ZeroPlay.exe')) { throw 'ZeroPlay.exe missing.' }
          if (!(Test-Path 'updater.cjs')) { throw 'Windows updater source missing.' }
          $source = Get-Content updater.cjs -Raw
          foreach ($needle in @('Expand-Archive','Start-Process','ZeroPlay-updater.log')) { if (-not $source.Contains($needle)) { throw "Updater repair marker missing: $needle" } }
      - name: Verify Authenticode signature when configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { Write-Warning 'Windows signing certificate is not configured.'; exit 0 }
          $sig=Get-AuthenticodeSignature 'dist/win-unpacked/ZeroPlay.exe'
          if ($sig.Status -ne 'Valid') { throw "Windows signature invalid: $($sig.Status)" }
      - name: Audit Windows release files
        run: python ../scripts/audit-release-secrets.py dist generated-config.json
      - name: Scan packaged Windows build with Microsoft Defender
        shell: pwsh
        run: |
          $scanner=(Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE)." }
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0.2-Windows
          path: windows/dist/ZeroPlay-2.0.2-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    if: ${{ always() && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.0.2-Android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.0.2-Windows
          path: release-assets
      - name: Generate checksums and final audit
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ZeroPlay-2.0.2-Android.apk ZeroPlay-2.0.2-Android-TV.apk ZeroPlay-2.0.2-Windows-x64.zip > SHA256SUMS.txt
          cd ..
          python scripts/audit-release-secrets.py release-assets
      - name: Publish stable v2.0.2 updater release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test ! "$(gh release view v2.0.2 --repo Zer0Spce/ZeroPlay --json tagName -q .tagName 2>/dev/null || true)" = "v2.0.2"
          gh release create v2.0.2 \
            release-assets/ZeroPlay-2.0.2-Android.apk \
            release-assets/ZeroPlay-2.0.2-Android-TV.apk \
            release-assets/ZeroPlay-2.0.2-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo Zer0Spce/ZeroPlay \
            --target "${GITHUB_SHA}" \
            --title "ZeroPlay v2.0.2 · Maintenance Update" \
            --notes-file docs/release-2.0.2.md
