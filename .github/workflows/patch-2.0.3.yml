          new='boolean wideDetails=BuildConfig.TV||getResources().getConfiguration().screenWidthDp>=720;if(wideDetails){LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(dp(BuildConfig.TV?210:220),-2);ap.setMargins(dp(22),0,0,0);heading.addView(actions,ap);}panel.addView(heading);if(!wideDetails){space(panel,16);panel.addView(actions,new LinearLayout.LayoutParams(-1,-2));}if(item.type.equals("series")){space(panel,12);LinearLayout episodeControls=new LinearLayout(this);boolean stackEpisodeSelectors=!BuildConfig.TV&&getResources().getConfiguration().screenWidthDp<600;episodeControls.setOrientation(stackEpisodeSelectors?LinearLayout.VERTICAL:LinearLayout.HORIZONTAL);episodeControls.setGravity(Gravity.CENTER_VERTICAL);LinearLayout seasonColumn=column(),episodeColumn=column();seasonColumn.addView(text("Season",12,MUTED));episodeColumn.addView(text("Episode",12,MUTED));detailSeasonPicker.setContentDescription("Select season");detailEpisodePicker.setContentDescription("Select episode");detailSeasonPicker.setFocusable(true);detailEpisodePicker.setFocusable(true);detailSeasonPicker.setAdapter(spinnerAdapter(new String[]{"Loading seasons…"}));detailEpisodePicker.setAdapter(spinnerAdapter(new String[]{"Loading episodes…"}));detailSeasonPicker.setEnabled(false);detailEpisodePicker.setEnabled(false);if(BuildConfig.TV){detailSeasonPicker.setBackgroundResource(lightTheme?R.drawable.tv_dropdown_selector_light:R.drawable.tv_dropdown_selector);detailEpisodePicker.setBackgroundResource(lightTheme?R.drawable.tv_dropdown_selector_light:R.drawable.tv_dropdown_selector);}seasonColumn.addView(detailSeasonPicker,new LinearLayout.LayoutParams(-1,dp(48)));episodeColumn.addView(detailEpisodePicker,new LinearLayout.LayoutParams(-1,dp(48)));if(stackEpisodeSelectors){episodeControls.addView(seasonColumn,new LinearLayout.LayoutParams(-1,-2));space(episodeControls,8);episodeControls.addView(episodeColumn,new LinearLayout.LayoutParams(-1,-2));}else{LinearLayout.LayoutParams selectorLp=new LinearLayout.LayoutParams(0,-2,1);selectorLp.setMargins(0,0,dp(10),0);episodeControls.addView(seasonColumn,selectorLp);episodeControls.addView(episodeColumn,new LinearLayout.LayoutParams(0,-2,1));}panel.addView(episodeControls,new LinearLayout.LayoutParams(-1,-2));}'
          if old not in s: raise SystemExit('Android details layout hook not found')
          s=s.replace(old,new,1)
          old='detailData[0]=data;titleExtras(rich,data,item,renderVersion);recommendations(related,data,item,renderVersion);'
          new='detailData[0]=data;if(item.type.equals("series"))configureSeriesSelectors(item,data,detailSeasonPicker,detailEpisodePicker,detailSeason,detailEpisode);titleExtras(rich,data,item,renderVersion);recommendations(related,data,item,renderVersion);'
          if old not in s: raise SystemExit('Android details async hook not found')
          s=s.replace(old,new,1)
          hook='    void watch(Catalog.Item item){if(item.type.equals("manga")){chapters(item,0);return;}if(item.type.equals("series")){seasons(item);return;}'
          helper='''    void configureSeriesSelectors(Catalog.Item item,JSONObject data,Spinner seasonPicker,Spinner episodePicker,int[] selectedSeason,int[] selectedEpisode){
        JSONArray raw=data.optJSONArray("seasons");if(raw==null||seasonPicker==null||episodePicker==null)return;List<Integer> numbers=new ArrayList<>();List<String> labels=new ArrayList<>();for(int i=0;i<raw.length();i++){JSONObject row=raw.optJSONObject(i);if(row==null||row.optInt("episode_count")<=0)continue;int number=row.optInt("season_number");numbers.add(number);labels.add(row.optString("name",number==0?"Specials":"Season "+number));}if(numbers.isEmpty()){seasonPicker.setAdapter(spinnerAdapter(new String[]{"No seasons"}));episodePicker.setAdapter(spinnerAdapter(new String[]{"No episodes"}));return;}int preferred=0;for(int i=0;i<numbers.size();i++)if(numbers.get(i)==1){preferred=i;break;}String[] seasonLabels=labels.toArray(new String[0]);int[] seasonNumbers=new int[numbers.size()];for(int i=0;i<numbers.size();i++)seasonNumbers[i]=numbers.get(i);seasonPicker.setAdapter(spinnerAdapter(seasonLabels));seasonPicker.setSelection(preferred,false);seasonPicker.setEnabled(true);selectedSeason[0]=seasonNumbers[preferred];seasonPicker.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> p){}public void onItemSelected(AdapterView<?> p,View v,int position,long id){if(position<0||position>=seasonNumbers.length)return;selectedSeason[0]=seasonNumbers[position];loadSeriesEpisodeSelector(item,selectedSeason[0],episodePicker,selectedEpisode);}});loadSeriesEpisodeSelector(item,selectedSeason[0],episodePicker,selectedEpisode);
    }
    void loadSeriesEpisodeSelector(Catalog.Item item,int season,Spinner episodePicker,int[] selectedEpisode){selectedEpisode[0]=0;episodePicker.setEnabled(false);episodePicker.setAdapter(spinnerAdapter(new String[]{"Loading episodes…"}));String id=item.id.substring(item.id.lastIndexOf('-')+1),key=tmdbKey();io.execute(()->{try{JSONArray episodes=ContentApi.seasonEpisodes(id,season,key);String[] labels=new String[episodes.length()];int[] numbers=new int[episodes.length()];for(int i=0;i<episodes.length();i++){JSONObject ep=episodes.optJSONObject(i);numbers[i]=ep.optInt("episode",i+1);labels[i]="Episode "+numbers[i]+" · "+ep.optString("title","Episode "+numbers[i]);}ui.post(()->{if(isDestroyed()||!detailsOpen)return;if(labels.length==0){episodePicker.setAdapter(spinnerAdapter(new String[]{"No episodes"}));return;}episodePicker.setAdapter(spinnerAdapter(labels));episodePicker.setSelection(0,false);episodePicker.setEnabled(true);selectedEpisode[0]=numbers[0];episodePicker.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> p){}public void onItemSelected(AdapterView<?> p,View v,int position,long rowId){if(position>=0&&position<numbers.length)selectedEpisode[0]=numbers[position];}});});}catch(Exception error){ui.post(()->{if(isDestroyed()||!detailsOpen)return;episodePicker.setAdapter(spinnerAdapter(new String[]{"Episodes unavailable"}));message("Episode service unavailable. Try again later.");});}});}
    void watchSelectedEpisode(Catalog.Item item,int season,int episode){if(!item.id.matches("tmdb-series-[0-9]+")){seasons(item);return;}if(episode<1){message("Choose an episode first");return;}try{String id=item.id.substring("tmdb-series-".length());chooseStreams(item,ContentApi.movieSources(id,"tv",season,episode),item.id+":s"+season+"e"+episode);}catch(JSONException error){message("Could not open this episode");}}
'''
