name: Repair ZeroPlay 2.0.1 Windows

on:
  push:
    branches: [repair/v2.0.1-windows-updater]
  workflow_dispatch:

concurrency:
  group: zeroplay-v2-0-1-windows-repair
  cancel-in-progress: true

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
  RAWCAST_API_KEY: ''
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

jobs:
  windows-repair:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Desktop interface regressions
        run: |
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          node scripts/ui-check.cjs
          node scripts/live-compat-check.cjs
          node scripts/player-exit-check.cjs

      - name: Verify updater source syntax
        run: node --check updater.cjs

      - name: Verify player controls and QR filtering
        run: |
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          $env:ZERO_GUARD_PATH = "assets/player-guard.js"
          node ../tests/player-guard.test.cjs

      - name: Configure bundled keys
        run: npm run prepare-config

      - name: Verify live TMDB discovery and search
        run: node scripts/tmdb-check.cjs

      - name: Windows app smoke test
        run: npx electron . --smoke-test

      - name: Package portable ZIP
        run: npm run build

      - name: Verify repaired 2.0.1 package
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ZeroPlay-2.0.1-Windows-x64.zip')) { throw '2.0.1 Windows ZIP was not produced.' }
          if ((Get-Item 'dist/ZeroPlay-2.0.1-Windows-x64.zip').Length -le 0) { throw '2.0.1 Windows ZIP is empty.' }
          $unpacked = 'dist/win-unpacked/resources/app.asar.unpacked/updater.cjs'
          if (!(Test-Path $unpacked)) { throw 'Packaged updater.cjs is missing.' }
          $text = Get-Content $unpacked -Raw
          foreach ($needle in @('robocopy.exe','Updated ZeroPlay.exe failed verification after copy.','Start-Process -FilePath $launch -WorkingDirectory $target','ZeroPlay-updater.log')) {
            if (-not $text.Contains($needle)) { throw "Updater repair marker missing: $needle" }
          }

      - name: Verify Authenticode signature when configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Warning 'Trusted Windows signing certificate is not configured; SmartScreen reputation warning may appear.'
            exit 0
          }
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'Packaged Windows executable not found.' }
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows executable signature is not valid: $($signature.Status)" }

      - name: Audit Windows release files
        run: python ../scripts/audit-release-secrets.py dist generated-config.json

      - name: Scan packaged Windows build with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable; release blocked.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE); release blocked." }

      - name: Republish Windows asset only
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/repair-release-2.0.1-windows.py
