name: ZeroPlay 2.0 Android Test Re-run
on:
  push:
    branches: ['test/2.0-fixes-1-23']
    paths: ['.github/workflows/test-build-2.0-android-rerun.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-fixes-1-23
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixes 1 through 23 contracts
        run: |
          grep -q 'releases/latest' app/src/main/java/com/zerostreams/app/AppUpdater.java
          grep -q 'getContentLength()' app/src/main/java/com/zerostreams/app/AppUpdater.java
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'flixLayout' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'String fallback=BuildConfig.TV?"classic":"google"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'scheduleReconnect' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'styleSettingsSpinner' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'classicLayout()||googleLayout()' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'liveCignal' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'liveConverge' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Player and TV navigation tests
        env:
          NODE_PATH: /tmp/zero-qr-tests/node_modules
          ZERO_GUARD_PATH: app/src/main/assets/player-guard.js
        run: |
          mkdir -p /tmp/zero-rule-tests
          javac -d /tmp/zero-rule-tests app/src/main/java/com/zerostreams/app/AdBlockRules.java app/src/main/java/com/zerostreams/app/TitleSearch.java app/src/main/java/com/zerostreams/app/ProgressRules.java tests/PlayerRulesTest.java tests/ProgressRulesTest.java
          java -cp /tmp/zero-rule-tests com.zerostreams.app.PlayerRulesTest
          java -cp /tmp/zero-rule-tests com.zerostreams.app.ProgressRulesTest
          npm install --prefix /tmp/zero-qr-tests --no-audit --no-fund jsdom@24.1.3
          node tests/player-guard.test.cjs
          node tests/tv-navigation.test.cjs
      - name: Unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --no-daemon
      - name: Lint
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug --no-daemon
      - name: Build and verify signed APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease --no-daemon
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk ZeroPlay-2.0-Test-Fixes-1-23-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk ZeroPlay-2.0-Test-Fixes-1-23-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0-Test-Android-Fixes-1-23
          path: |
            ZeroPlay-2.0-Test-Fixes-1-23-Android.apk
            ZeroPlay-2.0-Test-Fixes-1-23-AndroidTV.apk
          if-no-files-found: error
