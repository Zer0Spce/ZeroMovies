name: Episode Progress Test

on:
  push:
    branches:
      - test/2.1-pre-release

permissions:
  contents: read

concurrency:
  group: episode-progress-test
  cancel-in-progress: true

jobs:
  android:
    name: Android Mobile + TV Episode Progress
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply episode progress fix
        run: node scripts/apply-episode-progress-fix.cjs
      - name: Apply embedded completion fix
        run: node scripts/apply-browser-completion-fix.cjs
      - name: Verify episode progress wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'putLong("position:"+key,Math.max(1,position))' app/src/main/java/com/zerostreams/app/HistoryStore.java
          grep -q 'saveHistoryProgress' app/src/main/java/com/zerostreams/app/PlayerActivity.java
          grep -q 'duration:"+key' app/src/main/java/com/zerostreams/app/PlayerActivity.java
          grep -q 'episodeReminder' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q '__zeroProgressMeta' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -q 'terminal=event.optBoolean("ended",false)' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -q 'zerostreams-direct-progress' app/src/main/assets/player-guard.js
          grep -q "video.addEventListener('ended'" app/src/main/assets/player-guard.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Build signed Mobile + TV APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk app/build/outputs/apk/ZeroPlay-2.1-Episode-Progress-Mobile.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk app/build/outputs/apk/ZeroPlay-2.1-Episode-Progress-TV.apk
      - name: Lint Mobile + TV
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.1-Episode-Progress-Android
          path: |
            app/build/outputs/apk/ZeroPlay-2.1-Episode-Progress-Mobile.apk
            app/build/outputs/apk/ZeroPlay-2.1-Episode-Progress-TV.apk
          compression-level: 0
