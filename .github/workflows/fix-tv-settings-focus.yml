name: Fix Android TV settings focus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tv-settings-focus.yml'
      - 'scripts/fix_tv_settings_focus.py'

permissions:
  contents: write

jobs:
  patch-settings-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shared Settings spinner focus UI
        run: python scripts/fix_tv_settings_focus.py
      - name: Verify patch
        run: |
          grep -q 'styleSettingsSpinner' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Keep rows transparent so Android TV' app/src/main/java/com/zerostreams/app/MainActivity.java
          git diff --check
      - name: Commit focus fix
        run: |
          rm -f .github/workflows/fix-tv-settings-focus.yml scripts/fix_tv_settings_focus.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java .github/workflows/fix-tv-settings-focus.yml scripts/fix_tv_settings_focus.py
          git commit -m 'Fix Android TV settings dropdown focus visibility'
          git push origin HEAD:main
