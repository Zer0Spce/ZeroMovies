name: ZeroPlay v1.7 development checks
on:
  push:
    branches: [development/v1.7]
  workflow_dispatch:
concurrency:
  group: v17-development-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test both Android production variants
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:compileMobileDebugAndroidTestJavaWithJavac :app:compileTvDebugAndroidTestJavaWithJavac :app:lintMobileRelease :app:lintTvRelease
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false jsdom@24.1.3
      - run: npm test
      - run: node scripts/ui-check.cjs
      - run: node scripts/experience-check.cjs
      - run: npx electron scripts/media-check.cjs
      - name: Player and remote regressions
        env:
          ZERO_GUARD_PATH: windows/assets/player-guard.js
          NODE_PATH: windows/node_modules
        run: |
          cd ..
          node tests/player-guard.test.cjs
          node tests/tv-navigation.test.cjs
