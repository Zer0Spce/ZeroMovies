name: ZeroPlay Development Test Builds
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: read
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          git diff --exit-code v1.9 -- \
            app/src/main/java/com/zerostreams/app/LivePlayerActivity.java \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java
      - name: Configure persistent signing key
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeroplay-test-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeroplay-test-release.jks" >> "$GITHUB_ENV"
      - name: Test and build Android TV release
        run: gradle :app:testTvReleaseUnitTest :app:assembleTvRelease --stacktrace
      - name: Prepare signed Android TV test APK
        shell: bash
        run: |
          mkdir -p test-assets
          apk=$(find app/build/outputs/apk/tv/release -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          cp "$apk" test-assets/ZeroPlay-2.0-DEV-Android-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0-DEV-Android-TV
          path: test-assets/ZeroPlay-2.0-DEV-Android-TV.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeroplay-test-release.jks"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Protect Live TV Sports and PPV files
        shell: bash
        run: |
          git fetch origin tag v1.9 --force
          git diff --exit-code v1.9 -- ui/live-player.html ui/live-player.js ui/live-player.css live-preload.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Configure bundled TMDB key and local vendors
        run: npm run prepare-config
      - name: Windows app smoke test
        run: npx electron . --smoke-test
      - name: Package portable ZIP
        run: npm run build
      - name: Audit Windows credentials
        run: python ../scripts/audit-release-secrets.py dist generated-config.json
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $scanner = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE)." }
      - name: Prepare Windows test ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/ZeroPlay-*.zip | Select-Object -First 1
          if (!$zip) { throw 'Portable ZIP missing' }
          Copy-Item $zip.FullName dist/ZeroPlay-2.0-DEV-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0-DEV-Windows-x64
          path: windows/dist/ZeroPlay-2.0-DEV-Windows-x64.zip
          if-no-files-found: error
