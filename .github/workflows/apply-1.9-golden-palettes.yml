name: Apply ZeroPlay 1.9 Golden Palettes
on:
  push:
    branches: [release/v1.9]
    paths:
      - scripts/apply-1.9-golden-palettes.py
      - .github/workflows/apply-1.9-golden-palettes.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Apply expanded palettes and Golden mode
        run: python scripts/apply-1.9-golden-palettes.py
      - name: Prove live playback files remain untouched
        run: |
          git fetch --tags --force
          git diff --exit-code v1.8.2 -- windows/ui/live-player.html windows/ui/live-player.js windows/ui/live-player.css windows/live-preload.cjs
      - name: Validate Windows palettes and tests
        working-directory: windows
        run: |
          node - <<'NODE'
          const {themes}=require('./themes.cjs');
          if(Object.keys(themes).length!==17) throw Error('Expected 17 themes, found '+Object.keys(themes).length);
          for(const [id,t] of Object.entries(themes)) for(const key of ['bg','surface','ink','muted','accent']) if(!/^#[0-9a-f]{6}$/i.test(t[key]||'')) throw Error(id+' invalid '+key);
          console.log('Validated '+Object.keys(themes).length+' themes');
          NODE
          npm ci --no-audit --no-fund
          npm test
          node --check ui/app.js
          node --check ui/experience.js
      - name: Android mobile and TV compile
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Guard palette and Golden mode behavior
        run: |
          for id in midnight ember forest rose amethyst cyber cobalt gold coral aurora slate mocha; do
            grep -q "palettes.put(\"$id\"" app/src/main/java/com/zerostreams/app/MainActivity.java
            grep -q "$id:{name:" windows/themes.cjs
          done
          grep -q 'goldenegg' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Golden mode activated' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Golden mode activated' windows/ui/experience.js
          grep -q '#egg-sparkles' windows/ui/style.css
          grep -q 'golden-shimmer' windows/ui/style.css
          grep -q 'ScrollView choiceScroll' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Commit validated appearance changes
        run: |
          git config user.name 'ZeroPlay CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java windows/themes.cjs windows/ui/app.js windows/ui/experience.js windows/ui/style.css
          git diff --cached --check
          git commit -m 'Add 1.9 palettes and Golden ZeroPlay easter egg'
          git pull --rebase origin release/v1.9
          git push origin HEAD:release/v1.9
