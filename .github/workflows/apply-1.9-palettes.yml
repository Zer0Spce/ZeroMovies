name: Apply ZeroPlay 1.9 Palettes
on:
  push:
    branches: [release/v1.9]
    paths:
      - scripts/apply-1.9-palettes.py
      - .github/workflows/apply-1.9-palettes.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Apply guarded palette patch
        run: python scripts/apply-1.9-palettes.py
      - name: Prove live playback files remain untouched
        run: |
          git fetch --tags --force
          git diff --exit-code v1.8.2 -- windows/ui/live-player.html windows/ui/live-player.js windows/ui/live-player.css windows/live-preload.cjs
      - name: Validate 17 Windows themes
        working-directory: windows
        run: |
          node - <<'NODE'
          const {themes}=require('./themes.cjs');
          if(Object.keys(themes).length!==17) throw Error('Expected 17 themes, found '+Object.keys(themes).length);
          for(const [id,t] of Object.entries(themes)) for(const key of ['bg','surface','ink','muted','accent']) if(!/^#[0-9a-f]{6}$/i.test(t[key]||'')) throw Error(id+' invalid '+key);
          console.log(Object.entries(themes).map(([id,t])=>id+': '+t.name).join('\n'));
          NODE
          npm ci --no-audit --no-fund
          npm test
      - name: Android compile and tests
        run: |
          gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac
          gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Guard new palette IDs
        run: |
          for id in midnight ember forest rose amethyst cyber cobalt gold coral aurora slate mocha; do
            grep -q "palettes.put(\"$id\"" app/src/main/java/com/zerostreams/app/MainActivity.java
            grep -q "$id:{name:" windows/themes.cjs
          done
          grep -q 'ScrollView choiceScroll' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Commit validated palettes
        run: |
          git config user.name 'ZeroPlay CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java windows/themes.cjs
          git diff --cached --check
          git commit -m 'Add expanded 1.9 color palette library'
          git pull --rebase origin release/v1.9
          git push origin HEAD:release/v1.9
