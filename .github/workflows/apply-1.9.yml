name: Apply ZeroPlay 1.9
on:
  push:
    branches: [release/v1.9]
    paths:
      - scripts/apply-1.9.py
      - .github/workflows/apply-1.9.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Apply guarded 1.9 patch
        run: python scripts/apply-1.9.py
      - name: Prove Live TV / Sports / PPV player files are untouched
        run: |
          git fetch --tags --force
          git diff --exit-code v1.8.2 -- windows/ui/live-player.html windows/ui/live-player.js windows/ui/live-player.css windows/live-preload.cjs
      - name: Refresh exact Windows dependency lock
        working-directory: windows
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install Windows dependencies for tests
        working-directory: windows
        run: npm ci --no-audit --no-fund
      - name: Verify offline player dependency and torrent engine
        working-directory: windows
        run: |
          node -e "const p=require('video.js/package.json'); if(p.version!=='8.24.1') process.exit(1); console.log('Video.js',p.version)"
          node --input-type=module -e "import WebTorrent from 'webtorrent'; const c=new WebTorrent({tracker:true,dht:true,lsd:true,utPex:true,utp:true}); await c.destroy(); console.log('WebTorrent 3 OK')"
      - name: Windows unit tests
        working-directory: windows
        run: npm test
      - name: Android mobile and TV compile
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Guard requested 1.9 behavior
        shell: bash
        run: |
          grep -q "versionName '1.9'" app/build.gradle
          grep -q 'BuildConfig.TV?60:52' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'BuildConfig.TV?23:20' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'ZeroPlay-1.9-Windows-x64' windows/package.json
          grep -q 'video.js' windows/package.json
          grep -q 'openOffline(job,result)' windows/main.cjs
          test -f windows/ui/offline-player.html
          test -f windows/offline-media.cjs
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'ZeroPlay CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app windows
          git diff --cached --check
          git commit -m 'Implement ZeroPlay 1.9 polish and offline player'
          git pull --rebase origin release/v1.9
          git push origin HEAD:release/v1.9
