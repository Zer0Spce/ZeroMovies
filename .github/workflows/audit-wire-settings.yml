name: Apply audited Windows parity patch
on:
  push:
    branches: ['test/2.0-audited-1-23']
    paths: ['.github/workflows/audit-wire-settings.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-audited-1-23
      - name: Apply Windows fixes 19-22
        run: |
          python scripts/patch_windows_19_22.py
          node --check windows/ui/app.js
          node --check windows/core.cjs
          grep -q 'combined_credits' windows/ui/app.js
          grep -q 'combined_credits' windows/core.cjs
          grep -q 'Surprise me again' windows/ui/app.js
          grep -q 'Chinese titles' windows/ui/app.js
          grep -q 'Turkish titles' windows/ui/app.js
          grep -q 'data-person' windows/ui/app.js
          grep -q 'header-wordmark' windows/ui/index.html
          grep -q 'data-layout="flix"' windows/ui/layouts.css
          git diff --check
      - name: Commit Windows parity fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/core.cjs windows/ui/app.js windows/ui/index.html windows/ui/style.css
          git rm scripts/patch_windows_19_22.py
          git commit -m 'Complete Windows parity for fixes 19-22'
          git push origin HEAD:test/2.0-audited-1-23
