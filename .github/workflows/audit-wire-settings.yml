name: Wire audited Windows settings
on:
  push:
    branches: ['test/2.0-audited-1-23']
    paths: ['.github/workflows/audit-wire-settings.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-audited-1-23
      - name: Wire settings assets without replacing Flix UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('windows/ui/index.html')
          s=p.read_text()
          if 'settings-layout.css' not in s:
              s=s.replace('<link rel="stylesheet" href="layouts.css">','<link rel="stylesheet" href="layouts.css"><link rel="stylesheet" href="settings-layout.css">',1)
          if 'settings-layout.js' not in s:
              s=s.replace('<script src="layouts.js"></script><script src="app.js"></script>','<script src="layouts.js"></script><script src="settings-layout.js"></script><script src="app.js"></script>',1)
          if '<option value="flix">Flix UI</option>' not in s:
              raise SystemExit('Flix UI option missing before settings wiring')
          p.write_text(s)
          PY
          grep -q 'data-layout="flix"' windows/ui/layouts.css
          grep -q 'settings-layout.css' windows/ui/index.html
          grep -q 'settings-layout.js' windows/ui/index.html
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/ui/index.html
          git commit -m 'Wire audited Windows settings sections'
          git push origin HEAD:test/2.0-audited-1-23
