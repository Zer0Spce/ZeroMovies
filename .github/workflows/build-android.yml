name: One-time carousel patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_carousel_15s_slide.py'
      - 'scripts/build-android-original-17.yml'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #17 carousel fix
        run: python scripts/fix_carousel_15s_slide.py
      - name: Verify source edit
        run: |
          grep -q 'ui.postDelayed(this,15000)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'translationX(-distance)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'slideNext\[0\]' app/src/main/java/com/zerostreams/app/MainActivity.java
          git diff --check
      - name: Restore normal workflow and commit
        run: |
          cp scripts/build-android-original-17.yml .github/workflows/build-android.yml
          rm -f scripts/fix_carousel_15s_slide.py scripts/build-android-original-17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java .github/workflows/build-android.yml scripts/fix_carousel_15s_slide.py scripts/build-android-original-17.yml
          git commit -m 'Fix #17 carousel 15-second right-to-left transition'
          git push origin HEAD:main
