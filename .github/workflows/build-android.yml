name: Build ZeroPlay APKs
on:
  workflow_dispatch:
  push:
    branches:
      - fix/2.0-from-v1.9
permissions:
  contents: read
concurrency:
  group: zeroplay-android-fix-2-0
  cancel-in-progress: true
jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify player rules and title search
        run: |
          mkdir -p /tmp/zero-rule-tests
          javac -d /tmp/zero-rule-tests app/src/main/java/com/zerostreams/app/AdBlockRules.java app/src/main/java/com/zerostreams/app/TitleSearch.java app/src/main/java/com/zerostreams/app/ProgressRules.java tests/PlayerRulesTest.java tests/ProgressRulesTest.java
          java -cp /tmp/zero-rule-tests com.zerostreams.app.PlayerRulesTest
          java -cp /tmp/zero-rule-tests com.zerostreams.app.ProgressRulesTest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QR ad guard and remote controls
        env:
          NODE_PATH: /tmp/zero-qr-tests/node_modules
          ZERO_GUARD_PATH: app/src/main/assets/player-guard.js
        run: |
          npm install --prefix /tmp/zero-qr-tests --no-audit --no-fund jsdom@24.1.3
          node tests/player-guard.test.cjs
          node tests/tv-navigation.test.cjs
      - name: Check metadata key configuration
        run: |
          if [ -n "$TMDB_API_KEY" ]; then echo "Bundled TMDB key configured"; else echo "No bundled TMDB key; enter your key in app Settings"; fi
          if [ -n "$OMDB_API_KEY" ]; then echo "OMDb ratings configured"; else echo "No bundled OMDb key; Rotten Tomatoes ratings disabled"; fi
      - name: Test catalog, playlists, paging, history and QR scanning
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Compile both APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Lint both variants
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug
      - name: Print full lint results
        if: always()
        run: |
          for report in app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-mobile-and-tv-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Build signed Android update APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeromovies-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-mobile-and-tv-signed
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
