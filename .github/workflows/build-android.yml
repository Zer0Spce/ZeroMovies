name: Build ZeroStreams APKs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile both APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Lint both variants
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug
      - name: Print full lint results
        if: always()
        run: |
          for report in app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt; do
            if [ -f "$report" ]; then
              cat "$report"
            fi
          done
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroStreams-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroStreams-mobile-and-tv-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
