name: One-time Modern UI poster patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_modern_vertical_posters.py'
      - 'scripts/build-android-original.yml'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #16 Modern UI poster fix
        run: python scripts/fix_modern_vertical_posters.py
      - name: Verify source edit
        run: |
          grep -q 'dp((classicLayout()||googleLayout())?(BuildConfig.TV?150:132)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'new PosterFrame(this,(classicLayout()||googleLayout())?1.5f:9f/16f)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'String tileArt=(classicLayout()||googleLayout())?item.poster' app/src/main/java/com/zerostreams/app/MainActivity.java
          git diff --check
      - name: Restore normal workflow and commit
        run: |
          cp scripts/build-android-original.yml .github/workflows/build-android.yml
          rm -f scripts/fix_modern_vertical_posters.py scripts/build-android-original.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java .github/workflows/build-android.yml scripts/fix_modern_vertical_posters.py scripts/build-android-original.yml
          git commit -m 'Fix #16 Modern UI vertical movie posters'
          git push origin HEAD:main
