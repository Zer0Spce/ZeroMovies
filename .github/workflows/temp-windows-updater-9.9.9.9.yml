name: TEMP Windows Updater 9.9.9.9

on:
  workflow_dispatch:
  push:
    branches:
      - temp/windows-updater-9.9.9.9

permissions:
  contents: write

concurrency:
  group: temp-windows-updater-9-9-9-9
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TEST_VERSION: 9.9.9.9
      TEST_ASSET: ZeroPlay-9.9.9.9-r2-Windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run updater tests
        run: node --test test/updater.test.cjs

      - name: Configure bundled keys
        run: npm run prepare-config

      - name: Set packaged app metadata to 9.9.9.9
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.build=p.build||{};p.build.extraMetadata={...(p.build.extraMetadata||{}),version:process.env.TEST_VERSION};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.0.3') { throw 'Source package version was unexpectedly changed.' }
          if ($pkg.build.extraMetadata.version -ne $env:TEST_VERSION) { throw 'Temporary packaged version metadata was not set.' }

      - name: Build Windows portable package with Electron Builder
        run: npx electron-builder --win --x64 --publish never

      - name: Verify unpacked portable build and packaged version
        shell: pwsh
        run: |
          $root = 'dist/win-unpacked'
          $exe = Join-Path $root 'ZeroPlay.exe'
          $asar = Join-Path $root 'resources/app.asar'
          if (!(Test-Path $exe)) { throw 'ZeroPlay.exe is missing from win-unpacked.' }
          if (!(Test-Path $asar)) { throw 'resources/app.asar is missing from win-unpacked.' }
          $verify = 'dist/app-asar-verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          npx --yes @electron/asar extract $asar $verify
          $pkg = Get-Content (Join-Path $verify 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:TEST_VERSION) { throw "Expected packaged version $env:TEST_VERSION but found $($pkg.version)." }
          Remove-Item $verify -Recurse -Force
          Write-Host "Electron packaged ZeroPlay as version $env:TEST_VERSION"

      - name: Launch-test packaged app
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/win-unpacked/ZeroPlay.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Packaged ZeroPlay exited during launch test with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'Packaged ZeroPlay stayed running during launch test.'

      - name: Build updater ZIP with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $zip = Join-Path 'dist' $env:TEST_ASSET
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $source = (Resolve-Path 'dist/win-unpacked/*').Path
          $command = "Compress-Archive -Path 'dist\win-unpacked\*' -DestinationPath 'dist\$env:TEST_ASSET' -CompressionLevel Optimal -Force"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) { throw 'Windows PowerShell 5.1 failed to create the updater ZIP.' }
          Write-Host "Created $env:TEST_ASSET using Windows PowerShell 5.1"

      - name: Validate ZIP through the exact updater extraction path
        shell: pwsh
        run: |
          $stage = 'dist/updater-zip-verify'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          $command = "Expand-Archive -LiteralPath 'dist\$env:TEST_ASSET' -DestinationPath 'dist\updater-zip-verify' -Force"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 failed to extract the updater ZIP.' }
          node -e "const fs=require('fs/promises'),path=require('path');(async()=>{const stage=path.resolve('dist/updater-zip-verify');const q=[[stage,0]];while(q.length){const [d,depth]=q.shift();let es;try{es=await fs.readdir(d,{withFileTypes:true})}catch{continue}if(es.some(e=>e.isFile()&&e.name.toLowerCase()==='zeroplay.exe')){try{await fs.access(path.join(d,'resources','app.asar'));console.log('UPDATER_ROOT='+d);process.exit(0)}catch{}}if(depth<4)for(const e of es)if(e.isDirectory()&&e.name!=='__MACOSX')q.push([path.join(d,e.name),depth+1])}console.error('No updater-compatible portable root found');process.exit(1)})()"
          if ($LASTEXITCODE -ne 0) { throw 'The ZIP fails the actual locatePortableRoot() logic used by ZeroPlay.' }
          $exe = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'ZeroPlay.exe' | Select-Object -First 1
          $asar = Join-Path $exe.Directory.FullName 'resources/app.asar'
          $asarVerify = 'dist/updater-asar-verify'
          if (Test-Path $asarVerify) { Remove-Item $asarVerify -Recurse -Force }
          npx --yes @electron/asar extract $asar $asarVerify
          $pkg = Get-Content (Join-Path $asarVerify 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:TEST_VERSION) { throw "Updater ZIP contains app version $($pkg.version), expected $env:TEST_VERSION." }
          Remove-Item $asarVerify -Recurse -Force
          Remove-Item $stage -Recurse -Force
          Write-Host "Updater ZIP passed Windows PowerShell 5.1 extraction + locatePortableRoot + version $env:TEST_VERSION"

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $zip = Join-Path 'dist' $env:TEST_ASSET
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $env:TEST_ASSET" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256 $hash"

      - name: Replace temporary release with cache-busting asset
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          gh release view "v$env:TEST_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { throw "Temporary release v$env:TEST_VERSION does not exist." }
          gh release delete-asset "v$env:TEST_VERSION" "ZeroPlay-$env:TEST_VERSION-Windows-x64.zip" -y --repo "$env:GITHUB_REPOSITORY" 2>$null
          gh release delete-asset "v$env:TEST_VERSION" "$env:TEST_ASSET" -y --repo "$env:GITHUB_REPOSITORY" 2>$null
          gh release delete-asset "v$env:TEST_VERSION" "SHA256SUMS.txt" -y --repo "$env:GITHUB_REPOSITORY" 2>$null
          gh release upload "v$env:TEST_VERSION" `
            "windows/dist/$env:TEST_ASSET" `
            "windows/dist/SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY"

      - name: Summary
        shell: pwsh
        run: |
          Write-Host 'Temporary v9.9.9.9 package replaced with Windows PowerShell 5.1-compatible ZIP.'
          Write-Host "Published cache-busting asset: $env:TEST_ASSET"
