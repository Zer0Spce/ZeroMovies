name: Fix Clean UI Centered Rail
on:
  push:
    branches:
      - fix/windows-updater
    paths:
      - .github/workflows/fix-clean-rail-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-updater
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply centered icon fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zerostreams/app/MainActivity.java')
          s = p.read_text()
          old = '''for(Map.Entry<Button,String> entry:layoutRailButtons.entrySet()){Button b=entry.getKey();b.setText(expanded?entry.getValue():"");b.setGravity(expanded?(Gravity.CENTER_VERTICAL|Gravity.START):Gravity.CENTER);b.setCompoundDrawablePadding(dp(expanded?12:0));b.setPadding(dp(expanded?12:0),dp(5),dp(expanded?12:0),dp(5));if(BuildConfig.TV){ViewGroup.LayoutParams bp=b.getLayoutParams();bp.width=expanded?ViewGroup.LayoutParams.MATCH_PARENT:dp(46);bp.height=dp(46);b.setLayoutParams(bp);}}'''
          new = '''for(Map.Entry<Button,String> entry:layoutRailButtons.entrySet()){Button b=entry.getKey();String label=entry.getValue();String iconTab=label.equals("Live PPV")?"LiveTV":label.equals("Live TV")?"IPTV":label.equals("My library")?"Library":label;b.setText(expanded?label:"");b.setGravity(expanded?(Gravity.CENTER_VERTICAL|Gravity.START):Gravity.CENTER);if(expanded){b.setForeground(null);b.setCompoundDrawablesWithIntrinsicBounds(new LayoutIcon(this,iconTab,INK),null,null,null);b.setCompoundDrawablePadding(dp(12));b.setPadding(dp(12),dp(5),dp(12),dp(5));}else{b.setCompoundDrawables(null,null,null,null);b.setCompoundDrawablePadding(0);b.setPadding(0,0,0,0);b.setForeground(new LayoutIcon(this,iconTab,INK));b.setForegroundGravity(Gravity.CENTER);}if(BuildConfig.TV){ViewGroup.LayoutParams bp=b.getLayoutParams();bp.width=expanded?ViewGroup.LayoutParams.MATCH_PARENT:dp(46);bp.height=dp(46);b.setLayoutParams(bp);}}'''
          if old not in s:
              raise SystemExit('Clean rail anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Protect Live Sports and PPV
        run: |
          git fetch origin tag v1.9 --force
          git diff --quiet v1.9 -- app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java app/src/main/java/com/zerostreams/app/PlaylistStore.java app/src/main/java/com/zerostreams/app/SportsStore.java app/src/main/java/com/zerostreams/app/LiveSportsStore.java
      - name: Verify centered icon contract
        run: |
          grep -q 'b.setForeground(new LayoutIcon(this,iconTab,INK))' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'b.setForegroundGravity(Gravity.CENTER)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'b.setPadding(0,0,0,0)' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Compile Android Mobile and TV
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit Fix 12
        run: |
          git config user.name Zer0Spce
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java
          git commit -m 'Fix Clean UI collapsed icon centering [skip ci]'
          git push origin HEAD:fix/windows-updater
