name: Release ZeroPlay
on:
  push:
    branches: [release/v1.7]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified signed APKs and the tested Windows portable ZIP
        type: boolean
        default: true
      android_only:
        description: Update Android assets and reuse the published Windows ZIP
        type: boolean
        default: false
      reuse_windows_run:
        description: Reuse a tested Windows artifact from a release run with identical Windows source
        type: string
        default: ''
concurrency:
  group: zeroplay-production-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop superseded v1.7 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/37420719923/cancel || true
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing key
        id: signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeromovies-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeromovies-release.jks" >> "$GITHUB_ENV"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets missing: validating unsigned release variants; publishing is disabled.'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Player and remote regressions
        env:
          NODE_PATH: /tmp/zero-qr-tests/node_modules
          ZERO_GUARD_PATH: app/src/main/assets/player-guard.js
        run: |
          npm install --prefix /tmp/zero-qr-tests --no-audit --no-fund jsdom@24.1.3
          node tests/player-guard.test.cjs
          node tests/tv-navigation.test.cjs
      - name: Test, build and lint production variants
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:assembleMobileRelease :app:assembleTvRelease :app:lintMobileRelease :app:lintTvRelease
      - name: Audit Android release credentials
        run: python scripts/audit-release-secrets.py app/build app/src
      - name: Verify APKs and prepare assets
        env:
          SIGNED: ${{ steps.signing.outputs.ready }}
        shell: bash
        run: |
          mkdir -p release-assets
          for variant in mobile tv; do
            apk=$(find "app/build/outputs/apk/$variant/release" -name '*.apk' -print -quit)
            test -n "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='1.7'" || { echo 'Unexpected APK version'; exit 1; }
            if "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -q application-debuggable; then
              echo 'Refusing debuggable release APK'; exit 1
            fi
            if [ "$SIGNED" = true ]; then
              "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
              suffix=''
            else
              suffix='-unsigned'
            fi
            if [ "$variant" = mobile ]; then
              cp "$apk" "release-assets/ZeroPlay-1.7-Android$suffix.apk"
            else
              cp "$apk" "release-assets/ZeroPlay-1.7-Android-TV$suffix.apk"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-production-validation-${{ steps.signing.outputs.ready }}
          path: release-assets/*.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeromovies-release.jks"
  windows:
    if: ${{ !inputs.android_only && !inputs.reuse_windows_run }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Desktop interface regressions
        run: |
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          node scripts/ui-check.cjs
          node scripts/experience-check.cjs
          node scripts/live-compat-check.cjs
          node scripts/player-exit-check.cjs
      - name: Verify player controls and QR filtering
        run: |
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          $env:ZERO_GUARD_PATH = "assets/player-guard.js"
          node ../tests/player-guard.test.cjs
      - name: Verify downloaded video playback
        run: npx electron scripts/media-check.cjs
      - name: Configure bundled TMDB key
        run: npm run prepare-config
      - name: Verify live TMDB discovery and search
        run: node scripts/tmdb-check.cjs
      - name: Windows app smoke test
        run: npx electron . --smoke-test
      - name: Package portable ZIP
        run: npm run build
      - name: Audit Windows release credentials
        run: python ../scripts/audit-release-secrets.py dist generated-config.json
      - name: Scan packaged Windows files with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable; release blocked.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE); release blocked." }
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-production-windows
          path: |
            windows/dist/ZeroPlay-*.zip
            windows/dist/desktop-*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots-Windows
          path: windows/dist/desktop-*.png
          if-no-files-found: error

  player-devices:
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      ZERO_TEST_BUILD_TYPE: release
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Mobile
            density: 420
          - variant: Tv
            density: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure production signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeromovies-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeromovies-release.jks" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm density ${{ matrix.density }}
            gradle :app:connected${{ matrix.variant }}ReleaseAndroidTest
            mkdir -p ui-captures
            variant=$(echo '${{ matrix.variant }}' | tr '[:upper:]' '[:lower:]'); for name in home categories live-sports settings home-panels; do adb pull "/data/local/tmp/zeroplay-$name.png" "ui-captures/android-$variant-$name.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots-${{ matrix.variant }}
          path: ui-captures/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-device-tests-${{ matrix.variant }}
          path: app/build/reports/androidTests

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeromovies-release.jks"


  publish:
    needs: [supersede, android, windows, player-devices]
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/release/v1.7')) && needs.player-devices.result == 'success' && needs.android.result == 'success' && needs.android.outputs.signed == 'true' && (needs.windows.result == 'success' || ((inputs.android_only || inputs.reuse_windows_run) && needs.windows.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-production-validation-true
          path: release-assets
      - name: Validate reusable Windows build
        if: ${{ inputs.reuse_windows_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_WINDOWS_RUN: ${{ inputs.reuse_windows_run }}
        run: python scripts/verify-windows-reuse.py
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.android_only && !inputs.reuse_windows_run }}
        with:
          name: ZeroPlay-production-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.android_only && inputs.reuse_windows_run }}
        with:
          name: ZeroPlay-production-windows
          run-id: ${{ inputs.reuse_windows_run }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Final release credential audit
        run: python scripts/audit-release-secrets.py release-assets
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ONLY: ${{ inputs.android_only }}
        run: python scripts/publish-release.py
