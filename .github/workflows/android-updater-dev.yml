name: Android Updater Development
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Fix 13 Android TV content focus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/zerostreams/app/MainActivity.java')
          s=p.read_text()
          start=s.index('    @Override public boolean dispatchKeyEvent(KeyEvent event){')
          end=s.index('    @Override protected void onResume()', start)
          new='''    @Override public boolean dispatchKeyEvent(KeyEvent event){
              if(BuildConfig.TV&&event.getAction()==KeyEvent.ACTION_DOWN&&content!=null&&sidebar!=null){
                  int key=event.getKeyCode();
                  if(key==KeyEvent.KEYCODE_DPAD_UP||key==KeyEvent.KEYCODE_DPAD_DOWN||key==KeyEvent.KEYCODE_DPAD_LEFT||key==KeyEvent.KEYCODE_DPAD_RIGHT){
                      View current=getCurrentFocus();
                      if(current!=null&&!descendant(sidebar,current)&&descendant(content,current)){
                          int direction=key==KeyEvent.KEYCODE_DPAD_UP?View.FOCUS_UP:key==KeyEvent.KEYCODE_DPAD_DOWN?View.FOCUS_DOWN:key==KeyEvent.KEYCODE_DPAD_LEFT?View.FOCUS_LEFT:View.FOCUS_RIGHT;
                          View root=getWindow().getDecorView();
                          View next=root instanceof ViewGroup?FocusFinder.getInstance().findNextFocus((ViewGroup)root,current,direction):null;
                          if(next!=null&&descendant(sidebar,next)){
                              if(direction==View.FOCUS_LEFT&&event.getRepeatCount()==0){
                                  Rect here=new Rect();current.getGlobalVisibleRect(here);
                                  if(here.left<=dp(youtubeLayout()?92:classicLayout()?180:80))return super.dispatchKeyEvent(event);
                              }
                              View contentNext=FocusFinder.getInstance().findNextFocus(content,current,direction);
                              if(contentNext!=null&&contentNext!=current){contentNext.requestFocus();return true;}
                              return true;
                          }
                      }
                  }
              }
              return super.dispatchKeyEvent(event);
          }
          '''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Protect Live Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          if git diff --quiet v1.9 -- \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java; then
            echo 'Protected Live Sports / PPV files unchanged.'
          else
            echo 'Protected Live Sports / PPV file changed.' >&2
            exit 1
          fi
      - name: Verify Live TV reliability contract
        run: |
          grep -q 'MAX_AUTO_RETRIES=4' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'setAllowCrossProtocolRedirects(true)' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'scheduleReconnect' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'setConnectTimeoutMs(20000)' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'setReadTimeoutMs(30000)' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
      - name: Verify updater settings TV navigation compact rail Modern UI and Fix 13 contracts
        run: |
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'releases/latest' app/src/main/java/com/zerostreams/app/AppUpdater.java
          grep -q 'settingsHeading(panel,"GENERAL"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Android TV movie player controls' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'descendant(content,current)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'FocusFinder.getInstance().findNextFocus(content,current,direction)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'if(direction==View.FOCUS_LEFT&&event.getRepeatCount()==0)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'lastTvNavAt' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -q 'bestScore=Infinity' app/src/main/assets/player-guard.js
          grep -q 'BuildConfig.TV?56:52' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'alphaColor(ACCENT,0x66)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'brand.setGravity(Gravity.CENTER)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'BuildConfig.TV?168:140' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q '"Search","Home","Movies","Series","IPTV","LiveTV","Live Sports","Downloads"' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: TV navigation regression test
        run: |
          rm -rf /tmp/zero-tv-test
          mkdir -p /tmp/zero-tv-test
          npm install --prefix /tmp/zero-tv-test --no-audit --no-fund --ignore-scripts jsdom@24.1.3
          NODE_PATH=/tmp/zero-tv-test/node_modules ZERO_GUARD_PATH=app/src/main/assets/player-guard.js node tests/tv-navigation.test.cjs
      - name: Compile Android Mobile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Compile Android TV
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit Fix 13
        run: |
          git config user.name Zer0Spce
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java
          git commit -m 'Stabilize Android TV home content focus [skip ci]'
          git push origin HEAD:fix/windows-updater
