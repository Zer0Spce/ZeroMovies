name: Android Updater Development
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply guarded settings polish
        run: python3 scripts/polish-android-settings.py
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          if git diff --quiet v1.9 -- \
            app/src/main/java/com/zerostreams/app/LivePlayerActivity.java \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java; then
            echo 'Protected Live TV / Sports / PPV files unchanged.'
          else
            echo 'Protected Live TV / Sports / PPV file changed.' >&2
            exit 1
          fi
      - name: Verify settings structure
        run: |
          grep -q 'settingsHeading(panel,"GENERAL"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'settingsHeading(panel,"APPEARANCE"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'settingsHeading(panel,"PLAYBACK & DOWNLOADS"' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Compile Android Mobile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Compile Android TV
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit validated settings polish
        run: |
          if git diff --quiet -- app/src/main/java/com/zerostreams/app/MainActivity.java; then
            echo 'Settings polish already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java
          git commit -m 'Clean up Android settings UI [skip ci]'
          git push origin HEAD:fix/windows-updater
