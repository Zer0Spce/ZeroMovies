name: Android Updater Development
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply compact Android TV Clean UI rail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/zerostreams/app/MainActivity.java')
          s=p.read_text()
          old='''void addLayoutRail(LinearLayout outer){sidebar=column();sidebar.setPadding(dp(3),dp(16),dp(3),dp(12));sidebar.setBackgroundColor(youtubeLayout()&&!lightTheme?Color.rgb(15,15,15):BG);'''
          new='''void addLayoutRail(LinearLayout outer){sidebar=column();sidebar.setPadding(dp(3),dp(16),dp(3),dp(12));if(BuildConfig.TV)sidebar.setGravity(Gravity.CENTER_HORIZONTAL);sidebar.setBackgroundColor(youtubeLayout()&&!lightTheme?Color.rgb(15,15,15):BG);'''
          if old not in s and new not in s: raise SystemExit('rail setup anchor missing')
          if new not in s:s=s.replace(old,new,1)
          old='''outer.addView(layoutRailScroll,new LinearLayout.LayoutParams(dp(BuildConfig.TV?60:52),-1));setRailExpanded(false);}'''
          new='''outer.addView(layoutRailScroll,new LinearLayout.LayoutParams(dp(BuildConfig.TV?56:52),-1));setRailExpanded(false);}'''
          if old not in s and new not in s: raise SystemExit('rail width anchor missing')
          if new not in s:s=s.replace(old,new,1)
          old='''lp.width=dp(expanded?(BuildConfig.TV?205:185):(BuildConfig.TV?60:52));layoutRailScroll.setLayoutParams(lp);for(Map.Entry<Button,String> entry:layoutRailButtons.entrySet()){Button b=entry.getKey();b.setText(expanded?entry.getValue():"");b.setGravity(Gravity.CENTER_VERTICAL|(expanded?Gravity.START:Gravity.CENTER_HORIZONTAL));b.setCompoundDrawablePadding(dp(expanded?12:0));b.setPadding(dp(expanded?12:0),dp(5),dp(expanded?12:0),dp(5));}'''
          new='''lp.width=dp(expanded?(BuildConfig.TV?205:185):(BuildConfig.TV?56:52));layoutRailScroll.setLayoutParams(lp);for(Map.Entry<Button,String> entry:layoutRailButtons.entrySet()){Button b=entry.getKey();b.setText(expanded?entry.getValue():"");b.setGravity(expanded?(Gravity.CENTER_VERTICAL|Gravity.START):Gravity.CENTER);b.setCompoundDrawablePadding(dp(expanded?12:0));b.setPadding(dp(expanded?12:0),dp(5),dp(expanded?12:0),dp(5));if(BuildConfig.TV){ViewGroup.LayoutParams bp=b.getLayoutParams();bp.width=expanded?ViewGroup.LayoutParams.MATCH_PARENT:dp(46);bp.height=dp(46);b.setLayoutParams(bp);}}'''
          if old not in s and new not in s: raise SystemExit('rail collapse anchor missing')
          if new not in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          if git diff --quiet v1.9 -- \
            app/src/main/java/com/zerostreams/app/LivePlayerActivity.java \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java; then
            echo 'Protected Live TV / Sports / PPV files unchanged.'
          else
            echo 'Protected Live TV / Sports / PPV file changed.' >&2
            exit 1
          fi
      - name: Verify compact rail contract
        run: |
          grep -q 'BuildConfig.TV?56:52' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'bp.width=expanded?ViewGroup.LayoutParams.MATCH_PARENT:dp(46)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'b.setGravity(expanded?(Gravity.CENTER_VERTICAL|Gravity.START):Gravity.CENTER)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'sidebar.setGravity(Gravity.CENTER_HORIZONTAL)' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: TV navigation regression test
        run: |
          rm -rf /tmp/zero-tv-test
          mkdir -p /tmp/zero-tv-test
          npm install --prefix /tmp/zero-tv-test --no-audit --no-fund --ignore-scripts jsdom@24.1.3
          NODE_PATH=/tmp/zero-tv-test/node_modules ZERO_GUARD_PATH=app/src/main/assets/player-guard.js node tests/tv-navigation.test.cjs
      - name: Compile Android Mobile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Compile Android TV
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit validated compact rail
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Compact rail already applied.'
            exit 0
          fi
          git commit -m 'Polish Android TV Clean UI collapsed sidebar [skip ci]'
          git push origin HEAD:fix/windows-updater
