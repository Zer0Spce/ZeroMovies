name: Android Updater Development
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply guarded TV navigation fixes
        run: python3 scripts/fix-tv-navigation.py
      - name: Add subtle player focus highlight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/player-guard.js')
          s=p.read_text()
          old="const style=document.createElement('style');style.textContent='.zero-tv-focused{outline:3px solid #65e6cc!important;outline-offset:3px!important;border-radius:5px!important}';"
          new="const style=document.createElement('style');style.textContent='.zero-tv-focused{outline:2px solid #65e6cc!important;outline-offset:3px!important;border-radius:7px!important;box-shadow:0 0 0 2px rgba(101,230,204,.12),0 0 16px rgba(101,230,204,.28)!important;filter:brightness(1.08)!important;transition:outline-color .12s,box-shadow .12s,filter .12s!important}';"
          if old not in s and new not in s: raise SystemExit('focus highlight anchor missing')
          if new not in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          if git diff --quiet v1.9 -- \
            app/src/main/java/com/zerostreams/app/LivePlayerActivity.java \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java; then
            echo 'Protected Live TV / Sports / PPV files unchanged.'
          else
            echo 'Protected Live TV / Sports / PPV file changed.' >&2
            exit 1
          fi
      - name: Verify updater settings and TV navigation contracts
        run: |
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'releases/latest' app/src/main/java/com/zerostreams/app/AppUpdater.java
          grep -q 'settingsHeading(panel,"GENERAL"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Android TV movie player controls' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'event.getRepeatCount()>0' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'lastTvNavAt' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -q 'bestScore=Infinity' app/src/main/assets/player-guard.js
          grep -q 'box-shadow:0 0 0 2px rgba(101,230,204,.12)' app/src/main/assets/player-guard.js
      - name: TV navigation regression test
        run: |
          npm --prefix tests ci --no-audit --no-fund
          ZERO_GUARD_PATH=../app/src/main/assets/player-guard.js node tests/tv-navigation.test.cjs
      - name: Compile Android Mobile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Compile Android TV
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit validated TV navigation fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java app/src/main/assets/player-guard.js tests/tv-navigation.test.cjs
          if git diff --cached --quiet; then
            echo 'TV navigation fixes already applied.'
            exit 0
          fi
          git commit -m 'Fix Android TV movie player and held-down navigation [skip ci]'
          git push origin HEAD:fix/windows-updater
