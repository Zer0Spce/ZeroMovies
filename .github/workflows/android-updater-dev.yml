name: Android Updater Development
on:
  push:
    branches: [fix/windows-updater]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Android TV Modern UI header polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/zerostreams/app/MainActivity.java')
          s=p.read_text()
          old='''        HorizontalScrollView top=new HorizontalScrollView(this);top.setHorizontalScrollBarEnabled(false);top.setContentDescription("Modern UI top navigation");top.setClipToOutline(true);top.setBackground(pill(alphaColor(SURFACE,0x88),alphaColor(INK,0x22)));top.setElevation(dp(6));\n        LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);row.setPadding(dp(12),dp(7),dp(12),dp(7));TextView brand=text("ZEROPLAY",BuildConfig.TV?23:20,INK);bold(brand);brand.setLetterSpacing(.07f);brand.setPadding(dp(12),0,dp(22),0);row.addView(brand,new LinearLayout.LayoutParams(-2,dp(46)));\n        for(String tab:new String[]{"Search","Home","LiveTV","Movies","Series","IPTV","Live Sports","Downloads"}){String label=tab.equals("Home")?"For you":tab.equals("Series")?"Shows":layoutLabel(tab);Button b=modernTab(tab,label);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-2,dp(46));lp.setMargins(0,0,dp(7),0);row.addView(b,lp);}'''
          new='''        HorizontalScrollView top=new HorizontalScrollView(this);top.setHorizontalScrollBarEnabled(false);top.setContentDescription("Modern UI top navigation");top.setClipToOutline(true);top.setBackground(pill(alphaColor(SURFACE,0x88),alphaColor(ACCENT,0x66)));top.setElevation(dp(6));\n        LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);row.setPadding(dp(12),dp(7),dp(12),dp(7));TextView brand=text("ZEROPLAY",BuildConfig.TV?24:20,BuildConfig.TV?ACCENT:INK);bold(brand);brand.setLetterSpacing(.07f);brand.setGravity(Gravity.CENTER);brand.setPadding(0,0,0,0);LinearLayout.LayoutParams brandLp=new LinearLayout.LayoutParams(dp(BuildConfig.TV?168:140),dp(46));brandLp.setMargins(0,0,dp(8),0);row.addView(brand,brandLp);\n        for(String tab:new String[]{"Search","Home","Movies","Series","IPTV","LiveTV","Live Sports","Downloads"}){String label=tab.equals("Home")?"For you":tab.equals("Series")?"Shows":layoutLabel(tab);Button b=modernTab(tab,label);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-2,dp(46));lp.setMargins(0,0,dp(7),0);row.addView(b,lp);}'''
          if old not in s and new not in s: raise SystemExit('Modern UI header anchor missing')
          if new not in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          if git diff --quiet v1.9 -- \
            app/src/main/java/com/zerostreams/app/LivePlayerActivity.java \
            app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/PlaylistStore.java \
            app/src/main/java/com/zerostreams/app/SportsStore.java \
            app/src/main/java/com/zerostreams/app/LiveSportsStore.java; then
            echo 'Protected Live TV / Sports / PPV files unchanged.'
          else
            echo 'Protected Live TV / Sports / PPV file changed.' >&2
            exit 1
          fi
      - name: Verify Modern UI header contract
        run: |
          grep -q 'alphaColor(ACCENT,0x66)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'brand.setGravity(Gravity.CENTER)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'BuildConfig.TV?168:140' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q '"Search","Home","Movies","Series","IPTV","LiveTV","Live Sports","Downloads"' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Verify previous updater settings TV navigation and compact rail contracts
        run: |
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'releases/latest' app/src/main/java/com/zerostreams/app/AppUpdater.java
          grep -q 'settingsHeading(panel,"GENERAL"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Android TV movie player controls' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'event.getRepeatCount()>0' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'lastTvNavAt' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -q 'bestScore=Infinity' app/src/main/assets/player-guard.js
          grep -q 'BuildConfig.TV?56:52' app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: TV navigation regression test
        run: |
          rm -rf /tmp/zero-tv-test
          mkdir -p /tmp/zero-tv-test
          npm install --prefix /tmp/zero-tv-test --no-audit --no-fund --ignore-scripts jsdom@24.1.3
          NODE_PATH=/tmp/zero-tv-test/node_modules ZERO_GUARD_PATH=app/src/main/assets/player-guard.js node tests/tv-navigation.test.cjs
      - name: Compile Android Mobile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Compile Android TV
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit validated Modern UI header polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Modern UI header polish already applied.'
            exit 0
          fi
          git commit -m 'Polish Android TV Modern UI header and tab order [skip ci]'
          git push origin HEAD:fix/windows-updater
