name: Temporary Updater Test Release
on:
  push:
    branches: [fix/windows-updater]
    paths: ['.github/workflows/updater-test-release-temp.yml']
permissions:
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare placeholder updater assets
        run: |
          mkdir -p test-release
          curl -L --fail --retry 3 -o test-release/ZeroPlay-9.9.9-TEST-Android.apk https://github.com/Zer0Spce/ZeroPlay/releases/download/v1.9/ZeroPlay-1.9-Android.apk
          curl -L --fail --retry 3 -o test-release/ZeroPlay-9.9.9-TEST-Android-TV.apk https://github.com/Zer0Spce/ZeroPlay/releases/download/v1.9/ZeroPlay-1.9-Android-TV.apk
          curl -L --fail --retry 3 -o test-release/ZeroPlay-9.9.9-TEST-Windows-x64.zip https://github.com/Zer0Spce/ZeroPlay/releases/download/v1.9/ZeroPlay-1.9-Windows-x64.zip
          cd test-release
          sha256sum ZeroPlay-9.9.9-TEST-Android.apk ZeroPlay-9.9.9-TEST-Android-TV.apk ZeroPlay-9.9.9-TEST-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish temporary updater test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.9.9-TEST --cleanup-tag -y 2>/dev/null || true
          gh release create v9.9.9-TEST \
            test-release/ZeroPlay-9.9.9-TEST-Android.apk \
            test-release/ZeroPlay-9.9.9-TEST-Android-TV.apk \
            test-release/ZeroPlay-9.9.9-TEST-Windows-x64.zip \
            test-release/SHA256SUMS.txt \
            --target fix/windows-updater \
            --title 'ZeroPlay v9.9.9-TEST · Updater Demo' \
            --notes 'PLACEHOLDER TEST UPDATE ONLY. No new source changes are included. This temporary stable release exists only to exercise ZeroPlay updater detection, changelog, download, verification, skip/cancel, and installer/replacement flow. Delete after testing.'
