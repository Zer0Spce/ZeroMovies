name: Temporary Same-Files Updater Build
on:
  push:
    branches: [fix/windows-updater]
    paths: ['.github/workflows/temp-same-files-update-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure release signing
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeroplay-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeroplay-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android variants
        run: gradle :app:assembleMobileRelease :app:assembleTvRelease
      - name: Verify and collect APKs
        shell: bash
        run: |
          mkdir -p update-assets
          mobile=$(find app/build/outputs/apk/mobile/release -name '*.apk' -print -quit)
          tv=$(find app/build/outputs/apk/tv/release -name '*.apk' -print -quit)
          test -n "$mobile" && test -n "$tv"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$mobile"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$tv"
          cp "$mobile" update-assets/Android.apk
          cp "$tv" update-assets/Android-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: same-files-android
          path: update-assets/*.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeroplay-release.jks"

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run prepare-config
      - run: npx electron . --smoke-test
      - run: npm run build
      - name: Collect portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force update-assets | Out-Null
          $zip = Get-ChildItem dist/ZeroPlay-*.zip | Select-Object -First 1
          if (!$zip) { throw 'Portable ZIP missing' }
          Copy-Item $zip.FullName update-assets/Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: same-files-windows
          path: windows/update-assets/Windows-x64.zip
          if-no-files-found: error
