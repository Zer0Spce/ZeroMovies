name: Audit and Build ZeroPlay 2.0 Test
on:
  push:
    branches: ['test/2.0-audited-1-23']
    paths: ['.github/workflows/audit-2.0-fixes.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-audited-1-23
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit Windows fixes 1-23
        shell: pwsh
        run: |
          $index = Get-Content ui/index.html -Raw
          $layouts = Get-Content ui/layouts.css -Raw
          $style = Get-Content ui/style.css -Raw
          $settings = Get-Content ui/settings-layout.js -Raw
          $appUi = Get-Content ui/app.js -Raw
          $core = Get-Content core.cjs -Raw
          $main = Get-Content main.cjs -Raw
          $offline = Get-Content ui/offline-player.js -Raw
          $offlineHtml = Get-Content ui/offline-player.html -Raw
          $updater = Get-Content updater.cjs -Raw
          $live = Get-Content ui/live-player.js -Raw
          $package = Get-Content package.json -Raw
          if ($updater -notmatch 'releases/latest' -or $updater -notmatch 'sha256|SHA-256') { throw 'Fix 1 updater contract missing' }
          if ($offline -notmatch 'disableTracks' -or $offline -notmatch 'srt|vtt|ass|ssa' -or $offlineHtml -notmatch 'tool-icon') { throw 'Fix 2/9 offline player contract missing' }
          foreach ($name in @('General','Home','Appearance','Experience','Playback & Downloads','Player','About')) { if ($settings -notmatch [regex]::Escape($name)) { throw "Fix 4 settings section missing: $name" } }
          if ($index -notmatch '<option value="flix">Flix UI</option>' -or $layouts -notmatch 'data-layout="flix"') { throw 'Fix 8 Flix UI is not selectable and styled' }
          if ($live -notmatch 'MAX_RETRIES=4' -or $live -notmatch 'maxAttempts:5' -or $live -notmatch 'scheduleRuntimeReconnect' -or $live -notmatch 'connectionTimeout:15000') { throw 'Fix 11 Windows Live TV retry contract missing' }
          if ($main -notmatch "uiLayout:'youtube'") { throw 'Fix 14 Windows Clean UI default missing' }
          if ($appUi -notmatch 'combined_credits' -or $core -notmatch 'combined_credits' -or $appUi -notmatch 'data-person') { throw 'Fix 19 cast filmography missing on Windows' }
          if ($appUi -notmatch 'categoryArtworkUsed' -or $appUi -notmatch 'Chinese titles' -or $appUi -notmatch 'Turkish titles' -or $style -notmatch 'genre-art') { throw 'Fix 20 category redesign/expansion missing on Windows' }
          if ($appUi -notmatch 'Surprise me again' -or $appUi -notmatch 'surpriseDetail') { throw 'Fix 21 Surprise Me Again missing on Windows' }
          if ($index -notmatch 'header-wordmark' -or $style -notmatch 'header-wordmark' -or $style -notmatch '\.brand\{color:var\(--ink\)') { throw 'Fix 22 theme-aware ZeroPlay branding missing on Windows' }
          if ($main -notmatch 'liveCignal:false' -or $main -notmatch 'liveConverge:false') { throw 'Fix 23 Windows provider defaults missing' }
          if ($index -notmatch 'settings-layout.js' -or $index -notmatch 'settings-layout.css') { throw 'Fix 4 settings organizer is not wired' }
          if ($package -notmatch '"version": "2.0.0-test"') { throw 'Windows test build is not labeled 2.0.0-test' }
      - name: Verify reorganized Settings DOM
        shell: pwsh
        run: |
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          node -e "const fs=require('fs'),{JSDOM}=require('jsdom');let html=fs.readFileSync('ui/index.html','utf8').replace(/<script[^>]*>[\s\S]*?<\/script>/g,'');const dom=new JSDOM(html,{runScripts:'outside-only'});dom.window.eval(fs.readFileSync('ui/settings-layout.js','utf8'));const names=[...dom.window.document.querySelectorAll('.settings-section>h3')].map(x=>x.textContent);for(const n of ['General','Home','Appearance','Experience','Playback & Downloads','Player','About'])if(!names.includes(n))throw Error('Missing settings section '+n);if(!dom.window.document.querySelector('#liveCignal')||!dom.window.document.querySelector('#liveConverge'))throw Error('Live TV provider toggles missing');if(!dom.window.document.querySelector('#torrentSearchSettings-enabled')?.closest('fieldset'))throw Error('TSP controls escaped their fieldset');if(dom.window.document.querySelector('#ui-layout option[value=flix]')?.textContent!=='Flix UI')throw Error('Flix selector missing');console.log('Settings DOM audit passed');"
      - run: npm test
      - name: Desktop regression checks
        shell: pwsh
        run: |
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          node scripts/ui-check.cjs
          node scripts/live-compat-check.cjs
          node scripts/player-exit-check.cjs
          $env:ZERO_GUARD_PATH = "assets/player-guard.js"
          node ../tests/player-guard.test.cjs
      - run: npm run prepare-config
      - run: node scripts/tmdb-check.cjs
      - name: Electron smoke test including Flix
        run: npx electron . --smoke-test
      - name: Build Windows portable ZIP
        run: npm run build
      - name: Prepare audited Windows artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ZeroPlay-2.0.0-test-Windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'Audited Windows ZIP not found' }
          Copy-Item $zip.FullName dist\ZeroPlay-2.0.0-test-Audited-Fixes-1-23-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0.0-test-Audited-Windows
          path: windows/dist/ZeroPlay-2.0.0-test-Audited-Fixes-1-23-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/2.0-audited-1-23
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Android fixes 1-23
        run: |
          set -euo pipefail
          A=app/src/main/java/com/zerostreams/app/MainActivity.java
          U=app/src/main/java/com/zerostreams/app/AppUpdater.java
          B=app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          M=app/src/main/java/com/zerostreams/app/TvMouse.java
          L=app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          C=app/src/main/java/com/zerostreams/app/ContentApi.java
          grep -q 'releases/latest' "$U"
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'playerMouseDefaultV1' "$B"
          grep -q 'KEYCODE_MENU' "$M"
          grep -q 'postDelayed(hide,5000)' "$M"
          grep -q 'playerControlsVisible' "$B"
          grep -q 'scheduleReconnect' "$L"
          grep -q 'setConnectTimeoutMs(20000)' "$L"
          grep -q 'flixLayout' "$A"
          grep -q 'String fallback=BuildConfig.TV?"classic":"google"' "$A"
          grep -q 'styleSettingsSpinner' "$A"
          grep -q 'classicLayout()||googleLayout()' "$A"
          grep -q '15000' "$A"
          grep -q 'Zero Dark' "$A"
          grep -q 'combined_credits' "$C"
          grep -q 'Chinese titles' app/src/main/java/com/zerostreams/app/DiscoveryCollections.java
          grep -q 'surpriseDetailId' "$A"
          grep -q 'brandText' "$A"
          grep -q 'liveCignal' "$A"
          grep -q 'liveConverge' "$A"
          grep -q 'prefs.getBoolean("liveConverge",true)' "$A"
          grep -q "versionCode 37" app/build.gradle
          grep -q "versionName '2.0.0-test'" app/build.gradle
      - name: Player and TV navigation regression tests
        env:
          NODE_PATH: /tmp/zero-qr-tests/node_modules
          ZERO_GUARD_PATH: app/src/main/assets/player-guard.js
        run: |
          mkdir -p /tmp/zero-rule-tests
          javac -d /tmp/zero-rule-tests app/src/main/java/com/zerostreams/app/AdBlockRules.java app/src/main/java/com/zerostreams/app/TitleSearch.java app/src/main/java/com/zerostreams/app/ProgressRules.java tests/PlayerRulesTest.java tests/ProgressRulesTest.java
          java -cp /tmp/zero-rule-tests com.zerostreams.app.PlayerRulesTest
          java -cp /tmp/zero-rule-tests com.zerostreams.app.ProgressRulesTest
          npm install --prefix /tmp/zero-qr-tests --no-audit --no-fund jsdom@24.1.3
          node tests/player-guard.test.cjs
          node tests/tv-navigation.test.cjs
      - name: Android Mobile and TV unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --no-daemon
      - name: Android Mobile and TV lint
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug --no-daemon
      - name: Build and verify signed audited APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease --no-daemon
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk ZeroPlay-2.0.0-test-Audited-Fixes-1-23-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk ZeroPlay-2.0.0-test-Audited-Fixes-1-23-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.0.0-test-Audited-Android
          path: |
            ZeroPlay-2.0.0-test-Audited-Fixes-1-23-Android.apk
            ZeroPlay-2.0.0-test-Audited-Fixes-1-23-AndroidTV.apk
          if-no-files-found: error
