name: Cleanup Temporary Updater Demo
on:
  push:
    branches: [fix/windows-updater]
    paths: ['.github/workflows/updater-demo-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary updater demo release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v9.9.9-TEST --yes --cleanup-tag
