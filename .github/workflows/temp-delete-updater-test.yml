name: Delete temporary updater test release
on:
  push:
    branches: [fix/2.0-from-v1.9]
    paths: [.github/workflows/temp-delete-updater-test.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary updater test release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.9.99 --repo Zer0Spce/ZeroPlay --cleanup-tag -y
