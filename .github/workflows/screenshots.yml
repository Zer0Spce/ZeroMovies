name: Capture UI gallery
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  windows-captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37331419967
          name: ZeroPlay-production-windows
          path: captures
      - uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots-Windows
          path: captures/*.png
          if-no-files-found: error
  android-captures:
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [Mobile, Tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :app:connected${{ matrix.variant }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zerostreams.app.GalleryTest
            mkdir -p ui-captures
            variant=$(echo '${{ matrix.variant }}' | tr '[:upper:]' '[:lower:]'); for name in home categories live-sports settings; do adb exec-out run-as "com.zerostreams.app.$variant" cat "files/screenshots/$name.png" > "ui-captures/android-$variant-$name.png"; test $(wc -c < "ui-captures/android-$variant-$name.png") -gt 1000 || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots-${{ matrix.variant }}
          path: ui-captures/*.png
          if-no-files-found: error
