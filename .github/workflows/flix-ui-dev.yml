name: Flix UI Development
on:
  push:
    branches:
      - fix/windows-updater
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Flix UI
        run: python3 scripts/apply-flix-ui.py
      - name: Protect Live TV Sports and PPV files
        run: |
          git fetch origin tag v1.9 --force
          git diff --exit-code v1.9 -- app/src/main/java/com/zerostreams/app/LivePlayerActivity.java app/src/main/java/com/zerostreams/app/SportsPlayerActivity.java app/src/main/java/com/zerostreams/app/PlaylistStore.java app/src/main/java/com/zerostreams/app/SportsStore.java app/src/main/java/com/zerostreams/app/LiveSportsStore.java windows/ui/live-player.html windows/ui/live-player.js windows/ui/live-player.css windows/live-preload.cjs
      - name: Verify Flix UI contracts
        run: |
          grep -q 'Flix UI' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'void addFlixRail' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'boolean flixLayout()' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'value="flix">Flix UI' windows/ui/index.html
          grep -q "'youtube','google','flix','classic'" windows/ui/layouts.js
          grep -q '2.0 Flix UI' windows/ui/layouts.css
          grep -q "layout==='flix'?200" windows/main.cjs
      - name: JavaScript syntax
        run: |
          node --check windows/ui/app.js
          node --check windows/ui/layouts.js
          node --check windows/main.cjs
      - name: Android Mobile compile
        run: gradle :app:compileMobileDebugJavaWithJavac --stacktrace
      - name: Android TV compile
        run: gradle :app:compileTvDebugJavaWithJavac --stacktrace
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --stacktrace
      - name: Commit Flix UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java windows/ui/index.html windows/ui/layouts.js windows/ui/layouts.css windows/ui/app.js windows/main.cjs
          if git diff --cached --quiet; then
            echo 'Flix UI already applied.'
            exit 0
          fi
          git commit -m 'Add Flix UI layout inspired by cinematic streaming interfaces [skip ci]'
          git push origin HEAD:fix/windows-updater
