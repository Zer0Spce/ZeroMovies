name: Validate Windows Torrent Hotfix

on:
  push:
    branches: [hotfix/windows-torrent-engine]
    paths:
      - windows/package.json
      - windows/torrent-downloads.cjs
      - windows/test/torrent-downloads.test.cjs
      - .github/workflows/windows-torrent-hotfix.yml

permissions:
  contents: write

jobs:
  windows-torrent:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Refresh lockfile for WebTorrent 3
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependency set
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify WebTorrent 3 loads and starts
        shell: pwsh
        run: |
          node --input-type=module -e "import WebTorrent from 'webtorrent'; const c=new WebTorrent({tracker:true,dht:true,lsd:true,utPex:true,utp:true}); if(!c) process.exit(1); console.log('WebTorrent', WebTorrent.VERSION || '3.x', 'engine OK'); await c.destroy();"
      - name: Windows unit tests
        run: npm test
      - name: Package portable Windows build
        run: npm run build
      - name: Commit refreshed dependency lock
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/package-lock.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Lock WebTorrent 3 dependencies for Windows"
          git push origin HEAD:hotfix/windows-torrent-engine
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-Windows-Torrent-Hotfix
          path: windows/dist/ZeroPlay-*.zip
          if-no-files-found: error
          retention-days: 3
