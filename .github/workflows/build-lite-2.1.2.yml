name: Build ZeroPlay Lite 2.1.2

on:
  push:
    branches: [feature/zeroplay-lite]

permissions:
  contents: write

concurrency:
  group: zeroplay-2-1-2-lite
  cancel-in-progress: false

jobs:
  lite:
    if: contains(github.event.head_commit.message, 'Build ZeroPlay Lite v2.1.2')
    name: Android Lite Mobile + TV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Lite isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '2.1.2'" app/build.gradle
          grep -q "liteMobile" app/build.gradle
          grep -q "liteTv" app/build.gradle
          grep -q "buildConfigField 'boolean', 'LITE', 'false'" app/build.gradle
          grep -q "buildConfigField 'boolean', 'LITE', 'true'" app/build.gradle
          grep -q 'class LiteMainActivity' app/src/main/java/com/zerostreams/app/LiteMainActivity.java
          test -f app/src/liteMobile/AndroidManifest.xml
          test -f app/src/liteTv/AndroidManifest.xml

      - name: Lite unit tests
        run: gradle :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build signed Lite APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          mobile=app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk
          tv=app/build/outputs/apk/liteTv/release/app-liteTv-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$mobile"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$tv"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$mobile" | head -n 1 | grep -q "versionName='2.1.2'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$tv" | head -n 1 | grep -q "versionName='2.1.2'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$mobile" | head -n 1 | grep -q "name='com.zerostreams.app.lite.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$tv" | head -n 1 | grep -q "name='com.zerostreams.app.lite.tv'"
          mkdir -p release-assets
          cp "$mobile" release-assets/ZeroPlay-2.1.2-Android-Lite.apk
          cp "$tv" release-assets/ZeroPlay-2.1.2-Android-TV-Lite.apk

      - name: Lint Lite Mobile + TV
        run: gradle --continue :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - name: Audit Lite release files
        run: python scripts/audit-release-secrets.py release-assets app/src

      - name: Generate Lite checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ZeroPlay-2.1.2-Android-Lite.apk ZeroPlay-2.1.2-Android-TV-Lite.apk > SHA256SUMS-Lite.txt
          cat SHA256SUMS-Lite.txt

      - name: Verify original v2.1.2 release assets remain present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(gh release view v2.1.2 --json assets --jq '.assets[].name')"
          grep -qx 'ZeroPlay-2.1.2-Android.apk' <<<"$names"
          grep -qx 'ZeroPlay-2.1.2-Android-TV.apk' <<<"$names"
          grep -qx 'ZeroPlay-2.1.2-Windows-x64.zip' <<<"$names"
          grep -qx 'SHA256SUMS.txt' <<<"$names"

      - name: Add Lite APKs to existing v2.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v2.1.2 \
            release-assets/ZeroPlay-2.1.2-Android-Lite.apk \
            release-assets/ZeroPlay-2.1.2-Android-TV-Lite.apk \
            release-assets/SHA256SUMS-Lite.txt \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.1.2-Lite-Production
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
