name: Validate ZeroPlay 1.8.2 UI

on:
  push:
    branches: [release/v1.8.2]
    paths:
      - scripts/apply-1.8.2-ui.py
      - .github/workflows/validate-1.8.2-ui.yml

permissions:
  contents: write

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded UI patch
        run: python scripts/apply-1.8.2-ui.py
      - name: Check patch formatting
        run: git diff --check
      - name: Compile Android phone and TV
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac --no-daemon
      - name: Android unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest --no-daemon
      - name: Windows unit tests
        working-directory: windows
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit validated UI pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zerostreams/app/MainActivity.java windows/ui/index.html windows/ui/layouts.css
          git diff --cached --quiet && exit 0
          git commit -m "Start ZeroPlay 1.8.2 Clean and Modern UI refresh"
          git restore scripts/apply-1.8.2-ui.py
          git pull --rebase origin release/v1.8.2
          git push origin HEAD:release/v1.8.2
