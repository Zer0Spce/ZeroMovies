name: Run selector placement fix
on:
  push:
    branches: [fix/2.0.3-windows-selector-placement]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2.0.3-windows-selector-placement
          fetch-depth: 0
      - run: python scripts/fix-selector-placement.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Windows 2.0.3 series selector placement"
          git push origin HEAD:fix/2.0.3-windows-selector-placement
