name: Temporary updater test 9.9.9

on:
  push:
    branches: [test/updater-9.9.9]
  workflow_dispatch:

concurrency:
  group: zeroplay-updater-test-9-9-9
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zeroplay-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zeroplay-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV test APK
        run: gradle :app:testTvReleaseUnitTest :app:assembleTvRelease :app:lintTvRelease
      - name: Verify Android TV placeholder version
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/tv/release/app-tv-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='9.9.9.9'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionCode='38'"
          ! "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -q application-debuggable
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/ZeroPlay-9.9.9-Android-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: updater-test-android-tv
          path: release-assets/ZeroPlay-9.9.9-Android-TV.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zeroplay-release.jks"

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      RAWCAST_API_KEY: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Configure bundled keys
        run: npm run prepare-config
      - name: Windows smoke test
        run: npx electron . --smoke-test
      - name: Build Windows updater test ZIP
        run: npm run build
      - name: Verify Windows placeholder versions
        shell: pwsh
        run: |
          $zip='dist/ZeroPlay-9.9.9-Windows-x64.zip'
          if (!(Test-Path $zip)) { throw 'Updater test ZIP was not produced.' }
          $exe=Get-Item 'dist/win-unpacked/ZeroPlay.exe'
          $info=$exe.VersionInfo
          if ($info.FileVersion -ne '9.9.9.9') { throw "Wrong FileVersion: $($info.FileVersion)" }
          if ($info.ProductVersion -notlike '9.9.9.9*') { throw "Wrong ProductVersion: $($info.ProductVersion)" }
          Write-Host "Verified ZeroPlay.exe FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
      - name: Audit Windows test package
        run: python ../scripts/audit-release-secrets.py dist generated-config.json
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $scanner=(Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $scanner) { throw 'Microsoft Defender scanner unavailable.' }
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or detected a threat (exit $LASTEXITCODE)." }
      - uses: actions/upload-artifact@v4
        with:
          name: updater-test-windows
          path: windows/dist/ZeroPlay-9.9.9-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [android-tv, windows]
    if: ${{ always() && needs.android-tv.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: updater-test-android-tv
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: updater-test-windows
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ZeroPlay-9.9.9-Android-TV.apk ZeroPlay-9.9.9-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish temporary updater validation release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v9.9.9 --repo Zer0Spce/ZeroPlay --cleanup-tag -y 2>/dev/null || true
          gh release create v9.9.9 release-assets/ZeroPlay-9.9.9-Android-TV.apk release-assets/ZeroPlay-9.9.9-Windows-x64.zip release-assets/SHA256SUMS.txt \
            --repo Zer0Spce/ZeroPlay \
            --target "${GITHUB_SHA}" \
            --title "ZeroPlay v9.9.9 · TEMPORARY UPDATER VALIDATION" \
            --notes "TEMPORARY updater validation release. Windows and Android TV only. Same ZeroPlay 2.0.1 app contents with placeholder version markers for updater replacement testing. Windows ZeroPlay.exe File/Product Version: 9.9.9.9. Android TV versionName: 9.9.9.9 (versionCode stays 38 so the real 2.0.1 APK can be restored without a version-code downgrade). This release will be deleted after updater validation is confirmed."
