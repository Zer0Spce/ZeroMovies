name: One-time fix 23
on:
  push:
    paths:
      - 'scripts/fix_23_live_tv_channels.py'
      - '.github/workflows/check-website.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: |
          python scripts/fix_23_live_tv_channels.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android mobile and TV
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac --no-daemon
      - name: Test Windows
        working-directory: windows
        run: |
          npm ci --ignore-scripts
          node --check ui/app.js
          node --check main.cjs
          npm test
      - name: Commit app changes
        run: |
          rm -f scripts/fix_23_live_tv_channels.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java windows/ui/app.js windows/ui/index.html windows/main.cjs scripts/fix_23_live_tv_channels.py
          git commit -m 'Fix #23 Live TV provider defaults and settings'
          git push origin HEAD:main
