name: One-time theme-name source generator
on:
  push:
    paths:
      - 'scripts/fix_theme_names.py'
      - '.github/workflows/check-website.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #18 theme naming cleanup
        run: |
          python scripts/fix_theme_names.py
          git diff --check
      - name: Commit app fix
        run: |
          rm -f scripts/fix_theme_names.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java scripts/fix_theme_names.py
          git commit -m 'Fix #18 clean theme names in Settings'
          git push origin HEAD:main
