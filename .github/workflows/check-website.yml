name: One-time theme-name source generator
on:
  push:
    paths:
      - 'scripts/fix_theme_names.py'
      - '.github/workflows/check-website.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate patched MainActivity
        run: |
          python scripts/fix_theme_names.py
          git diff --check
          echo 'BEGIN_PATCHED_MAINACTIVITY_BASE64'
          base64 -w0 app/src/main/java/com/zerostreams/app/MainActivity.java
          echo
          echo 'END_PATCHED_MAINACTIVITY_BASE64'
