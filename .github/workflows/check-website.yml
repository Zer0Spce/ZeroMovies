name: One-time fixes #19-#22
on:
  push:
    paths:
      - 'scripts/fix_19_22.py'
      - '.github/workflows/check-website.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python scripts/fix_19_22.py
          git diff --check
      - name: Compile Android
        run: |
          gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac
      - name: Commit app changes
        run: |
          rm -f scripts/fix_19_22.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/MainActivity.java app/src/main/java/com/zerostreams/app/ContentApi.java app/src/main/java/com/zerostreams/app/DiscoveryCollections.java scripts/fix_19_22.py
          git commit -m 'Fix #19-#22 cast categories surprise and branding'
          git push origin HEAD:main
