plugins { id 'com.android.application' }
android {
    namespace 'com.zerostreams.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zerostreams.app'
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName '0.4.6'
        buildConfigField 'String', 'DEFAULT_TMDB_KEY', groovy.json.JsonOutput.toJson(System.getenv('TMDB_API_KEY') ?: '')
    }
    flavorDimensions += 'device'
    productFlavors {
        mobile { dimension 'device'; applicationIdSuffix '.mobile'; buildConfigField 'boolean', 'TV', 'false' }
        tv { dimension 'device'; applicationIdSuffix '.tv'; buildConfigField 'boolean', 'TV', 'true' }
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
