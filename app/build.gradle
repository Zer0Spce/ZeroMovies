plugins { id 'com.android.application' }
android {
    namespace 'com.zerostreams.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zerostreams.app'
        minSdk 23
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 24
        versionName '1.6.0'
        buildConfigField 'String', 'DEFAULT_TMDB_KEY', groovy.json.JsonOutput.toJson(System.getenv('TMDB_API_KEY') ?: '')
    }
    flavorDimensions += 'device'
    productFlavors {
        mobile { dimension 'device'; applicationIdSuffix '.mobile'; buildConfigField 'boolean', 'TV', 'false' }
        tv { dimension 'device'; applicationIdSuffix '.tv'; buildConfigField 'boolean', 'TV', 'true' }
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-38'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.0'
    implementation 'androidx.media3:media3-ui:1.6.0'
}
