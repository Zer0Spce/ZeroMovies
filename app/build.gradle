plugins { id 'com.android.application' }
android {
    namespace 'com.zerostreams.app'
    compileSdk 35
    ndkVersion '26.1.10909125'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        applicationId 'com.zerostreams.app'
        minSdk 23
        targetSdk 35
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 38
        versionName '2.0.1'
        buildConfigField 'String', 'BUILD_REVISION', groovy.json.JsonOutput.toJson((System.getenv('GITHUB_SHA') ?: 'local').take(8))
        buildConfigField 'String', 'DEFAULT_TMDB_KEY', groovy.json.JsonOutput.toJson(System.getenv('TMDB_API_KEY') ?: '')
        buildConfigField 'String', 'DEFAULT_OMDB_KEY', groovy.json.JsonOutput.toJson(System.getenv('OMDB_API_KEY') ?: '')
        buildConfigField 'String', 'DEFAULT_TSP_KEY', groovy.json.JsonOutput.toJson('')
    }
    flavorDimensions += 'device'
    productFlavors {
        mobile { dimension 'device'; applicationIdSuffix '.mobile'; buildConfigField 'boolean', 'TV', 'false' }
        tv { dimension 'device'; applicationIdSuffix '.tv'; buildConfigField 'boolean', 'TV', 'true' }
        privateTv {
            dimension 'device'
            applicationIdSuffix '.tv'
            buildConfigField 'boolean', 'TV', 'true'
            buildConfigField 'String', 'DEFAULT_TSP_KEY', groovy.json.JsonOutput.toJson(System.getenv('TSP_API_KEY') ?: '')
        }
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    testBuildType System.getenv('ZERO_TEST_BUILD_TYPE') ?: 'debug'
    buildFeatures { buildConfig true }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.frostwire:jlibtorrent:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-arm:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-arm64:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-x86:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-x86_64:1.2.19.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
