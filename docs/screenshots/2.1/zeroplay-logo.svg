<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">ZeroPlay</title>
  <desc id="desc">ZeroPlay text logo for the 2.1 main page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff304f"/>
      <stop offset="0.5" stop-color="#ff5a36"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="38" fill="url(#bg)"/>
  <circle cx="185" cy="250" r="92" fill="#151a22" stroke="#2b3442" stroke-width="4"/>
  <path d="M157 197 L245 250 L157 303 Z" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="330" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="158" font-weight="800" letter-spacing="-8" fill="#f8fafc">Zero</text>
  <text x="716" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="158" font-weight="800" letter-spacing="-8" fill="url(#accent)">Play</text>
  <text x="338" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="8" fill="#94a3b8">MOVIES • SERIES • LIVE TV • SPORTS</text>
  <rect x="1230" y="70" width="250" height="58" rx="29" fill="#171d27" stroke="#303a4b"/>
  <text x="1355" y="109" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#e5e7eb">VERSION 2.1</text>
</svg>