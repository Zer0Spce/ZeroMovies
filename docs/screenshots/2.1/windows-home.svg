  <rect x="1185" y="128" width="322" height="250" rx="26" fill="#0c121c" stroke="#38465a"/>
  <polygon points="1307,198 1307,308 1403,253" fill="#ff4d52"/><text x="1346" y="342" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#cbd5e1">Muted hero trailer</text>
  <text x="155" y="510" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#f8fafc">Continue Watching</text>
