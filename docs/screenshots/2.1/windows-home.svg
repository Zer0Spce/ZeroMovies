<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZeroPlay 2.1 Windows Home</title>
  <desc id="desc">Fresh 2.1 showcase graphic for the Windows home experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b12"/><stop offset="1" stop-color="#121826"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#172033"/><stop offset="1" stop-color="#25151b"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3655"/><stop offset="1" stop-color="#ff7b31"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="70" rx="32" fill="#0d111a"/>
  <circle cx="35" cy="35" r="8" fill="#ff5f57"/><circle cx="61" cy="35" r="8" fill="#febc2e"/><circle cx="87" cy="35" r="8" fill="#28c840"/>
