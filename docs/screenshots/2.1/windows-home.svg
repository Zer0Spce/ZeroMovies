  <text x="205" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" fill="#f8fafc">Your next movie starts here.</text>
  <text x="205" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#b8c2d2">Choose the carousel source you want. The trailer now always follows the title on screen.</text>
