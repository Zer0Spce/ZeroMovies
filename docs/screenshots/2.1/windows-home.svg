    <g fill="#344256"><rect x="180" y="744" width="188" height="12" rx="6"/><rect x="440" y="744" width="188" height="12" rx="6"/><rect x="700" y="744" width="188" height="12" rx="6"/><rect x="960" y="744" width="188" height="12" rx="6"/><rect x="1220" y="744" width="188" height="12" rx="6"/></g>
