  </g>
  <rect x="1318" y="820" width="250" height="44" rx="22" fill="#111827" stroke="#334155"/><text x="1443" y="849" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#cbd5e1">Portable • No installer</text>
