  <rect x="28" y="94" width="92" height="770" rx="28" fill="#0c1119" stroke="#222b39"/>
  <g fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" text-anchor="middle">
